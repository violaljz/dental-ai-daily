<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>口腔×AI 文献库 · 每日精选</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#4f6ef7">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<style>
  :root{
    --bg:#f4f6fb;
    --bg-soft:#eef1f8;
    --card:#ffffff;
    --border:#e3e8f2;
    --text:#1b2433;
    --text-2:#5a6678;
    --text-3:#93a0b4;
    --mint:#34d399;
    --teal:#4f6ef7;
    --sky:#60a5fa;
    --pink:#f472b6;
    --lav:#a78bfa;
    --sand:#94a3b8;
    --mono:'JetBrains Mono',ui-monospace,Menlo,monospace;
    --sans:'Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
    --shadow:0 2px 10px rgba(40,60,120,.05),0 8px 30px rgba(40,60,120,.07);
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  body{background:var(--bg);color:var(--text);font-family:var(--sans);font-size:15px;line-height:1.6;-webkit-font-smoothing:antialiased;}

  header.hero{background:linear-gradient(120deg,#e0e9ff,#dcf3ff 55%,#e9e4ff);padding:46px 0 60px;position:relative;overflow:hidden;}
  header.hero::before{content:"";position:absolute;inset:0;background-image:linear-gradient(rgba(79,110,247,.05) 1px,transparent 1px),linear-gradient(90deg,rgba(79,110,247,.05) 1px,transparent 1px);background-size:32px 32px;}
  header.hero::after{content:"";position:absolute;right:-80px;top:-80px;width:280px;height:280px;border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,.55),transparent 70%);}
  .wrap{max-width:1040px;margin:0 auto;padding:0 24px;position:relative;z-index:1;}
  .kicker{font-family:var(--mono);font-size:12px;letter-spacing:2px;color:var(--teal);font-weight:700;text-transform:uppercase;}
  h1{font-size:30px;font-weight:800;margin-top:6px;letter-spacing:-.5px;}
  h1 .hl{background:linear-gradient(90deg,#4f6ef7,#22d3ee);-webkit-background-clip:text;background-clip:text;color:transparent;}
  .sub{color:var(--text-2);margin-top:6px;font-size:15px;}

  /* filter panel */
  .filter-panel{background:var(--card);border:1px solid var(--border);border-radius:18px;padding:18px 20px;margin-top:-34px;box-shadow:var(--shadow);}
  .fp-row{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px;}
  .fp-row:last-child{margin-bottom:0;}
  .fp-label{font-family:var(--mono);font-size:12px;color:var(--text-3);font-weight:700;letter-spacing:.5px;min-width:52px;}

  .chip{cursor:pointer;border:1.5px solid var(--border);background:#fff;color:var(--text-2);border-radius:999px;padding:5px 14px;font-size:13px;font-weight:500;transition:all .15s;user-select:none;}
  .chip:hover{border-color:var(--teal);color:var(--teal);}
  .chip.on{color:#fff;border-color:transparent;font-weight:600;}
  .chip.g-S.on{background:var(--pink);}
  .chip.g-A.on{background:var(--sky);}
  .chip.g-B.on{background:var(--mint);color:#0b3d2c;}
  .chip.g-C.on{background:var(--lav);}
  .chip.g-N.on{background:var(--sand);color:#4a453d;border-color:transparent;}

  .chip.tag-chip{font-size:12.5px;}
  .chip.tag-chip.on{background:var(--teal);border-color:var(--teal);color:#fff;}
  .chip.tag-chip.expand-btn{color:var(--teal);border-style:dashed;background:transparent;font-weight:600;}
  .chip.sort-chip{font-family:var(--mono);font-size:12px;letter-spacing:.5px;}
  .chip.sort-chip.on{background:var(--teal);border-color:var(--teal);color:#fff;}

  select{font-family:var(--sans);font-size:13px;color:var(--text-2);border:1.5px solid var(--border);border-radius:10px;padding:6px 12px;background:#fff;outline:none;cursor:pointer;}
  select:focus{border-color:var(--teal);}
  input[type=search]{font-family:var(--sans);font-size:13px;color:var(--text);border:1.5px solid var(--border);border-radius:10px;padding:7px 14px;background:#fff;outline:none;width:220px;}
  input[type=search]:focus{border-color:var(--teal);}
  .reset{cursor:pointer;font-family:var(--mono);font-size:12px;color:var(--teal);text-decoration:underline;padding:4px 6px;}

  .result-bar{display:flex;align-items:baseline;gap:10px;margin:26px 0 14px;}
  .result-bar .cnt{font-weight:700;font-size:15px;}
  .result-bar .cnt b{font-family:var(--mono);color:var(--teal);font-size:18px;}
  .result-bar .hint{font-size:12.5px;color:var(--text-3);}

  /* paper cards */
  #list{display:flex;flex-direction:column;gap:12px;padding-bottom:60px;}
  .paper{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:16px 20px;box-shadow:0 1px 4px rgba(20,60,50,.04);transition:box-shadow .2s,transform .2s;}
  .paper:hover{box-shadow:var(--shadow);transform:translateY(-1px);}
  .paper .head{display:flex;align-items:flex-start;gap:12px;flex-wrap:wrap;}
  .g{font-family:var(--mono);font-weight:700;font-size:12px;border-radius:8px;padding:3px 9px;color:#fff;letter-spacing:1px;flex-shrink:0;}
  .g.S{background:var(--pink);} .g.A{background:var(--sky);} .g.B{background:var(--mint);color:#0b3d2c;} .g.C{background:var(--lav);} .g.N{background:var(--sand);color:#4a453d;}
  .paper h3{font-size:16px;font-weight:700;line-height:1.4;letter-spacing:-.2px;flex:1;min-width:200px;}
  .paper .meta{font-family:var(--mono);font-size:11.5px;color:var(--text-3);margin-top:4px;}
  .paper .meta a{color:var(--teal);text-decoration:none;}
  .paper .meta a:hover{text-decoration:underline;}
  .paper .tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px;}
  .paper .tag{font-size:11.5px;color:var(--text-2);background:var(--bg-soft);border-radius:999px;padding:2px 10px;}
  .paper .note{margin-top:10px;font-size:13.5px;color:var(--text-2);background:var(--bg-soft);border-radius:10px;padding:10px 14px;}
  .paper .note b{color:var(--text);}
  .paper .detail{margin-top:10px;display:none;border-top:1px dashed var(--border);padding-top:10px;}
  .paper .detail .f{font-size:13.5px;color:var(--text-2);margin-bottom:6px;}
  .paper .detail .f b{color:var(--text);font-weight:600;}
  .paper .detail .f.limit b{color:#c2410c;}
  .toggle{cursor:pointer;font-family:var(--mono);font-size:11.5px;color:var(--teal);margin-top:10px;display:inline-block;user-select:none;}
  .toggle:hover{text-decoration:underline;}
  .empty{text-align:center;color:var(--text-3);padding:50px 0;font-size:14px;}
  .pagination{display:flex;align-items:center;justify-content:center;gap:14px;padding:8px 0 60px;}
  .pg-btn{cursor:pointer;font-family:var(--mono);font-size:13px;color:var(--text-2);border:1.5px solid var(--border);border-radius:10px;padding:6px 16px;background:#fff;transition:all .15s;}
  .pg-btn:hover:not(:disabled){border-color:var(--teal);color:var(--teal);}
  .pg-btn:disabled{opacity:.4;cursor:not-allowed;}
  .pg-info{font-family:var(--mono);font-size:13px;color:var(--text-3);}

  footer{padding:30px 0 50px;text-align:center;color:var(--text-3);font-size:12.5px;}
  footer .mono{font-family:var(--mono);}

  @media(max-width:640px){ h1{font-size:24px;} input[type=search]{width:100%;} .fp-row{gap:8px;} }
</style>
</head>
<body>

<header class="hero">
  <div class="wrap">
    <div class="kicker">Dental × AI Literature Library</div>
    <h1>口腔 × AI <span class="hl">文献库</span></h1>
    <div class="sub">每日精选 · 按等级 / 关键词 / 年份 / 关键词筛选</div>
  </div>
</header>

<div class="wrap">
  <div class="filter-panel">
    <div class="fp-row">
      <span class="fp-label">等级</span>
      <span class="chip g-S" data-g="S">S</span>
      <span class="chip g-A" data-g="A">A</span>
      <span class="chip g-B" data-g="B">B</span>
      <span class="chip g-C" data-g="C">C</span>
      <span class="chip g-N" data-g="N">N</span>
      <span class="reset" id="resetAll">重置全部</span>
    </div>
    <div class="fp-row">
      <span class="fp-label">年份</span>
      <select id="yearSel">
        <option value="all">全部年份</option>
        <option>2026</option>
        <option>2025</option>
        <option>2024</option>
      </select>
      <span class="fp-label" style="margin-left:14px;">搜索</span>
      <input type="search" id="searchBox" placeholder="搜索标题 / 出处…">
    </div>
    <div class="fp-row">
      <span class="fp-label">关键词</span>
      <span id="tagRow" style="display:flex;gap:6px;flex-wrap:wrap;"></span>
    </div>
  </div>

  <div class="result-bar">
    <span class="cnt">共 <b id="count">0</b> 篇</span>
    <span class="hint">点击卡片下方「详情」查看目的 / 设计 / 结果 / 局限</span>
    <span class="sort-row" style="margin-left:auto;display:flex;gap:6px;">
      <span class="chip sort-chip on" data-sort="default">默认排序</span>
      <span class="chip sort-chip" data-sort="time">最新优先</span>
    </span>
  </div>

  <div id="list"></div>
  <div class="pagination">
    <button class="pg-btn" id="prevPage">‹ 上一页</button>
    <span class="pg-info" id="pageInfo">1 / 1 页</span>
    <button class="pg-btn" id="nextPage">下一页 ›</button>
  </div>
</div>

<footer>
  <div class="wrap">
    <div class="mono">DENTAL × AI LITERATURE · DATA FROM PUBMED / PMC / MEDRXIV</div>
  </div>
</footer>

司 Orca Dental AI 的 3D 影像获 FDA 批准（2026）。"}, {"g": "B", "title": "ChatGPT 与远程牙科在龋齿检测中的诊断准确性对比", "src": "BMC Oral Health", "year": 2026, "date": "08-22", "pmid": "42632883", "tags": ["大语言模型", "影像", "牙体牙髓", "数字化"], "note": "40 颗牙图片对比 ChatGPT 与远程牙科检测龋齿：远程牙科全面占优（准确率 87.5% vs 72.5%，AUC 0.876 vs 0.728），ChatGPT 一致性更差。属初步研究。", "purpose": "比较 ChatGPT（AI 评估）与远程牙科（牙医远程判读）在龋齿检测中的诊断准确性，以临床检查为金标准。", "design": "40 颗牙标准化手机图像，ChatGPT 分析与远程牙科独立判读对比临床检查；计算敏感性/特异性/PPV/NPV/准确率/AUC，Cohen's κ 与 McNemar 检验。", "result": "远程牙科全面优于 ChatGPT（敏感性 89.5% vs 78.9%，特异性 85.7% vs 66.7%，准确率 87.5% vs 72.5%，AUC 0.876 vs 0.728）；两者与金标准差异均无统计学意义，但 ChatGPT 一致性更差。", "limit": "小样本初步研究（40 牙图、单一图像来源）；ChatGPT 为通用模型、未经牙科影像专门微调，结果不能外推到真实临床。"}, {"g": "N", "title": "Curve Dental 追加 2 亿美元研发投入，加码 AI 一体化云端牙科软件", "src": "行业速递 · 资本", "year": 2026, "date": "08-20", "tags": ["资本", "融资", "产品"], "note": "AI 驱动的一体化云端牙科软件公司 Curve Dental 宣布向 Curve Hero 平台追加 2 亿美元研发投入；称北美约 85% 牙科诊所（约 16 万家）仍用老旧客户端-服务器系统，市场整合在即。"}, {"g": "N", "title": "比利时牙科 AI 公司 Relu 获 DIA 175 万美元战略投资", "src": "行业速递 · 资本", "year": 2026, "date": "08-04", "tags": ["资本", "融资", "产品"], "note": "Relu（Relu® Automate，自动化技工厂牙科设计与行政流程）获 Dental Innovation Alliance 175 万美元战略投资，加速美国扩张；平台年处理来自 82 国技工厂的 100 万+ 病例。"}, {"g": "A", "title": "云端 AI 软件前牙自动分割的多中心 CBCT 外部验证", "src": "Journal of Dentistry", "year": 2026, "date": "08-24", "pmid": "42637207", "tags": ["影像", "数字化", "深度学习", "产品"], "note": "190 例 CBCT、5 种设备、879 颗牙，云端 AI（Relu）自动分割 90.1% 达标；IoU 0.92–0.95、DSC 0.96–0.97。牙髓治疗、正畸托槽、邻近高密度伪影显著增加人工修正需求。", "purpose": "外部验证云端 AI 前牙自动分割软件的跨设备泛化能力，并识别需要人工修正的因素。", "design": "190 例 CBCT（5 种系统）、879 颗牙分割图；双评分者评估自动 vs 修正分割的体素/表面/时间效率指标；混合效应 logistic 回归分析修正需求相关因素（α=5%）。", "result": "90.1% 自动分割达标；跨设备 IoU 0.92–0.95、DSC 0.96–0.97、召回 0.94–0.95、MAD<0.07mm、RMSE<0.10mm；牙髓治疗(OR 4.43)、正畸托槽(OR 3.74)、邻近高密度伪影(OR 7.88)显著增加修正需求；自动分割显著快于人工。", "limit": "仅覆盖前牙，且由单一云端软件（Relu）评估；结论需在其他商业软件与更多中心进一步验证。"}, {"g": "A", "title": "EffiSegNet：光化性唇炎与唇鳞癌临床照片的自动分割", "src": "Journal of Oral Pathology & Medicine", "year": 2026, "date": "08-23", "pmid": "42634274", "tags": ["深度学习", "影像", "颌面外科"], "note": "EfficientNet-B0 + Ghost Module，489 张训练/内部测试 + 82 张两家机构外部验证；DSC 内部 0.888 / 外部 0.875，跨机构无性能下降，对溃疡/结痂/角化稳健。", "purpose": "开发并外部验证唇部潜在恶性病变（光化性唇炎）与唇鳞癌临床照片的深度学习分割模型。", "design": "EffiSegNet-B0（ImageNet 预训练 EfficientNet-B0 编码器 + Ghost Module 聚合多阶段特征）；489 张单中心照片训练/内部测试，82 张来自 UFPB、UFMG 两家独立机构外部验证。", "result": "内外部准确率均 >95%；DSC 内部 0.888（95%CI 0.871–0.904）、外部 0.875（0.862–0.888），IoU 0.802 / 0.782；外部验证无性能下降，对溃疡、结痂、角化等病变变异稳健。", "limit": "概念验证研究，样本来自有限机构；需前瞻性多中心、更大样本确认真实临床可用性。"}, {"g": "B", "title": "大语言模型 AI 提升口腔医学生沟通技能的作用", "src": "European Journal of Dental Education", "year": 2026, "date": "08-23", "pmid": "42634266", "tags": ["大语言模型", "数字化"], "note": "伦敦国王学院项目，用 LLM+RAG 模拟牙科情景训练医患沟通（2 文本 + 1 语音平台），试点反馈积极，拟对比传统演员教学。", "purpose": "探索大语言模型在培养本科口腔医学生医患沟通（行为改变）技能中的作用。", "design": "KCL 牙学院 × 信息系合作；3 代生成式 AI（2 文本 + 1 语音），构建 Q&A 数据集 + 医学信息库 RAG + LangChain 提示工程；志愿者临床人员与学生试点。", "result": "试点反馈积极，AI 平台可有效支持沟通技能培养；拟于 2024-25 学年面向二年级牙科/牙科卫生学生推广，并与传统演员教学随机对比。", "limit": "主要报告试点阶段，尚未完成与传统教学的随机对比；学习成效与满意度定量证据待发表。"}, {"g": "N", "title": "Overjet IRIS 获 FDA 批准：首个牙科影像质量实时 AI 检查系统", "src": "行业速递 · 审批", "year": 2026, "date": "08-04", "tags": ["审批", "产品"], "note": "Overjet 获第二项 FDA 批准，IRIS 成为首个获 FDA 批准的牙科影像质量 AI 系统，可在患者离椅前实时捕捉 X 光质量问题；与 Vision AI 诊断结合，覆盖整个就诊流程。"}, {"g": "B", "title": "机器人辅助计算机种植手术：系统架构、临床精度与新兴技术综合评述", "src": "Journal of Robotic Surgery", "year": 2026, "date": "08-25", "pmid": "42640525", "tags": ["种植", "机器人", "数字化", "器械/设备"], "note": "r-CAIS 结构化综述：梳理系统架构/分类/临床流程，对比静态与动态计算机辅助手术，分析影响种植精度的患者/医生/系统因素及优化策略；定性证据综合（无荟萃分析）。"}, {"g": "B", "title": "堆叠集成深度学习：根尖片根尖周病变检测与大小分层", "src": "Australian Endodontic Journal", "year": 2026, "date": "08-24", "pmid": "42638331", "tags": ["深度学习", "影像", "牙体牙髓"], "note": "146 张根尖片、5 种 CNN 骨架堆叠集成（MLR/XGBoost 元学习器），内测准确率 0.96、AUC 1.00，<2mm 病变灵敏度 0.94；单中心小样本，作者自评结果偏乐观。"}, {"g": "B", "title": "唾液液体活检用于口腔与全身疾病检测", "src": "Journal of Periodontal Research", "year": 2026, "date": "08-25", "pmid": "42638446", "tags": ["口腔微生物", "数字化", "AI/算法"], "note": "唾液液体活检综述，涵盖胞外 RNA/cfDNA/蛋白/代谢/微生物等多组学；AI 驱动的多组学整合、微流控与 POCT 正突破检测灵敏度与疾病分层瓶颈。"}, {"g": "C", "title": "机器学习预测腓动脉肌间隔穿支（腓骨瓣下颌骨重建）", "src": "Journal of Reconstructive Microsurgery", "year": 2026, "date": "08-25", "pmid": "42641646", "tags": ["颌面外科", "临床预测", "AI/算法"], "note": "246 例（490 肢）CTA、4900 个肢-区观察；XGBoost AUC 0.710，可中等程度预测穿支存在、再现腓骨中段高发峰，辅助腓骨瓣皮岛设计但无法替代影像定位。"}, {"g": "N", "title": "ADA 调研：AI 在诊所扎根但止步于治疗决策", "src": "行业速递 · 调研", "year": 2026, "date": "08-17", "tags": ["政策"], "note": "ADA HPI 对 552 位美国私人执业牙医调研：超 2/5 已用 AI 于至少一项任务、1/4 计划采用，但仅不足 1/20 用 AI 做治疗建议、超 4/5 明确不用；共识转向「AI 辅助、医生主导」。"}, {"g": "N", "title": "Medicall（DentalCall）AI 电话助手获种子轮融资", "src": "行业速递 · 资本", "year": 2026, "date": "08-14", "tags": ["资本"], "note": "韩国牙科诊所 AI 电话助手 DentalCall 运营商 Medicall 获种子轮融资（AI Angel Club、CNTTech、TaleVentures、Antler Korea 参投），用于扩大 AI 前台部署、减轻前台人力负担。"}, {"g": "A", "title": "OSCC 隐匿性颈淋巴结转移的 AI 分割：或减少细胞角蛋白染色需求", "src": "Histopathology", "year": 2026, "date": "08-27", "pmid": "42656182", "tags": ["颌面外科", "影像", "深度学习"], "note": "两阶段深度学习分割口腔鳞癌颈淋巴结隐匿转移，微调后 precision 0.878/召回 0.861、整体准确率 0.919，或减少 CK 免疫组化工作量。", "purpose": "开发两阶段深度学习框架，从常规 H&E 切片分割口腔鳞癌（OSCC）隐匿性颈淋巴结微转移，以减少对细胞角蛋白（CK）免疫组化的依赖。", "design": "资深病理医生标注的 OSCC 原发灶 + 颈淋巴结标本数据集；先在原发灶肿瘤形态预训练，再在淋巴结转移灶微调；留出独立测试集，像素级分割指标 + 病例级分析，与 CK 染色定性对比。", "result": "预训练阶段 precision 0.8484 / recall 0.8682；微调后提升至 0.8778 / 0.8607，整体准确率 0.9193；AI 预测与 CK 染色在可获取免疫组化病例中一致性良好。", "limit": "单中心、样本量有限，标注依赖资深病理医生且 CK 仅临床需要时补充；需前瞻性多中心验证方可评估临床减少 CK 染色的实际可行性与成本效益。"}, {"g": "A", "title": "深度学习 MRI 咬肌体积与老年人口腔损伤及认知衰弱相关", "src": "Experimental Gerontology", "year": 2026, "date": "08-26", "pmid": "42648504", "tags": ["影像", "深度学习", "临床预测"], "note": "CNN 分割 T1WI 咬肌，2077 名日本老年人，咬肌体积越大口腔损伤评分越低（OR 0.67）。", "purpose": "开发卷积神经网络（CNN）从 T1 加权 MRI 自动分割咬肌，检验咬肌体积这一影像结构表型与老年人口腔损伤及认知衰弱的关联。", "design": "人类在环迭代训练的 CNN（基于东北大学医院 T1WI）；应用于日本前瞻性衰老/痴呆协作研究 Hirosaki 队列 3D T1WI，图像质控后最终纳入 2077 名参与者（平均 69.9±4.1 岁）。", "result": "咬肌体积越大，复合口腔损伤评分越低（OR 0.67, 95%CI 0.60–0.74, p<0.001）；与结构异常关联最强（OR 0.60），其次牙周炎症（OR 0.81）、口腔功能下降（OR 0.86）；与认知衰弱呈负相关但完全校正后不显著。", "limit": "横断面设计无法确立因果；认知衰弱关联校正后不显著；预训练 CNN 已开源（github.com/bthyreau/masseter_mri），需纵向与多中心验证。"}, {"g": "B", "title": "PAISE：牙体牙髓领域 AI 研究报告规范（PRISMA 式）发布", "src": "International Endodontic Journal", "year": 2026, "date": "08-27", "pmid": "42656074", "tags": ["牙体牙髓", "监管"], "note": "国际牙体牙髓病学杂志宣布制定 AI 研究报告规范 PAISE，为该领域首个专门报告指南。"}, {"g": "B", "title": "全景片根尖孔开闭状态的深度学习检测：YOLO vs Faster R-CNN", "src": "Journal of Imaging Informatics in Medicine", "year": 2026, "date": "08-25", "pmid": "42642693", "tags": ["牙体牙髓", "影像", "深度学习"], "note": "1498 张儿童全景片，YOLOv8x 检测下颌磨牙根尖开闭状态 mAP@0.5 达 0.956，辅助儿科牙髓治疗决策。"}, {"g": "B", "title": "白光图像深度学习检测口腔潜在恶性病变与口腔癌：系统综述与 Meta 分析", "src": "Clinical Oral Investigations", "year": 2026, "date": "08-26", "pmid": "42645587", "tags": ["颌面外科", "影像", "深度学习"], "note": "汇总灵敏度 OPMD 0.81 / 口腔癌 0.836，但特异度极低（0.161 / 0.138），需警惕大量假阳性。"}, {"g": "B", "title": "大语言模型在口腔癌患者教育中的可靠性与可读性评估", "src": "Oral Health & Preventive Dentistry", "year": 2026, "date": "08-26", "pmid": "42644524", "tags": ["大语言模型", "颌面外科"], "note": "4 款 LLM 回答 22 个口腔癌问题，Perplexity Pro 可靠性评分最高（DISCERN 46.36 / EQIP 85），可读性普遍偏高。"}, {"g": "C", "title": "劈尖钻在皮质骨钻孔中的力/热坏死预测：有限元 + 神经网络建模", "src": "Biomedical Physics & Engineering Express", "year": 2026, "date": "08-26", "pmid": "42648309", "tags": ["种植", "AI/算法"], "note": "FEM+ANN 建模手术骨钻孔，劈尖钻 115° 劈角 + 0.25mm 腹板 + 7° 前角，钻力降 46.8%、热坏死降 5.2%。"}, {"g": "C", "title": "PDDUNet：原始-对偶深度展开网络用于 CT 金属伪影去除", "src": "Journal of X-Ray Science and Technology", "year": 2026, "date": "08-26", "pmid": "42647755", "tags": ["影像", "深度学习"], "note": "将数据保真项与正则项双重展开用于 CT 金属伪影去除（种植体等），合成 + 临床数据集优于现有 MAR 方法。"}, {"g": "N", "title": "Overjet Voice 上线免手硬组织图表与自然语音牙周图表", "src": "行业速递 · 产品", "year": 2026, "date": "08-17", "tags": ["大语言模型", "数字化"], "note": "基于自研实时大语言模型（98% 准确率、50M+ token 训练），覆盖 CareStack/Eaglesoft/Open Dental/Dentrix 等主流 PMS。"}, {"g": "N", "title": "Pearl 发布首个美国大规模影像口腔健康普查（Oral Health Index）", "src": "行业速递 · 数据", "year": 2026, "date": "08-10", "tags": ["影像", "临床预测"], "note": "用 FDA 获批 AI 分析 2600 万+ 就诊影像，未经治疗龋齿达既往全国估计 4.5 倍，AI 影像走向公共卫生基础设施。"}, {"g": "A", "title": "AI 聊天机器人与大语言模型用于牙外伤管理决策支持：系统综述与 Meta 分析", "src": "Dental Traumatology", "year": 2026, "date": "08-27", "pmid": "42657907", "tags": ["大语言模型", "AI/算法", "临床预测"], "note": "28 项研究纳入；探索性 Meta 分析显示准确/指南一致回答合并比例 81.7%，但异质性极高，安全性与引用可靠性存疑。", "purpose": "系统评价 AI 聊天机器人与大语言模型在牙外伤（牙脱位、撕脱、乳牙外伤等）管理与决策支持中的准确性、一致性、安全性与指南一致性。", "design": "检索 PubMed/Scopus/Embase 至 2026-04，纳入 28 项研究；按五大转化功能（患者/照护者急诊指导、指南基准、领域工作流、多模态真实病例、撕脱预后）叙事综合，并对 9 项二分类结局做探索性 Meta 分析。", "result": "准确/指南一致回答的合并比例为 81.7%（异质性极高）；性能随模型、提示格式、参考标准、输入类型与评估方法而异；常见安全隐患包括建议不完整、误导信息、回答不一致、可读性不足、引用不可靠。", "limit": "研究间异质性极高、评估方法差异大；多为横断面基准测试，缺乏真实急诊场景的前瞻性验证。"}, {"g": "B", "title": "AI 模型在 CBCT 上检测牙源性角化囊性瘤的诊断准确性：系统综述与 Meta 分析", "src": "Health Science Reports", "year": 2026, "date": "08-27", "pmid": "42657008", "tags": ["影像", "深度学习", "颌面外科"], "note": "12 项研究，合并灵敏度 89%（79–95%）、特异度 92%（81–97%）、AUC 0.828；深度学习（91%）灵敏度优于机器学习（86%）。"}, {"g": "C", "title": "智能纳米传感器与 IoT 系统的实时诊断监测进展", "src": "Analytical Methods", "year": 2026, "date": "08-27", "pmid": "42657776", "tags": ["数字化", "AI/算法", "口腔微生物", "器械/设备"], "note": "综述纳米传感器+AI+IoT 融合框架；电化学免疫传感器 120 秒内以 1.424 fg/mL 检出「口腔癌生物标志物」，石墨烯纳米传感器近 27 pM 检出 CRP。"}, {"g": "N", "title": "BeCertain 获 170 万英镑种子轮：临床级牙科诊断 AI（KCL/萨里分拆）", "src": "行业速递 · 资本", "year": 2026, "date": "07-16", "tags": ["融资", "资本"], "note": "伦敦国王学院（KCL）与萨里大学分拆公司 BeCertain 获 170 万英镑（约 200 万欧元）pre-seed，AI 风投 SVV（Sure Valley Ventures）领投、Innovate UK 支持；开发不确定度感知 ML，首个用例为 2D 口内 X 光片解读（龋齿/骨吸收/根尖周感染/修复体缺损）。"}, {"g": "N", "title": "韩国 InnoDtech 获 338 万美元：AI 正畸平台冲刺 FDA 与 CE 审批", "src": "行业速递 · 资本", "year": 2026, "date": "07-23", "tags": ["融资", "审批", "正畸", "产品"], "note": "AI 正畸平台 Dr.AlignNavi 与隐形矫治 Clara AI 开发商 InnoDtech 完成 KRW 50 亿（约 338 万美元）融资，Albatross、KDB、SK 证券参投；目标 9–10 月获 FDA 批准并推进欧洲 CE MDR。"}, {"g": "A", "title": "移动 AI 口腔病变分诊用于社区口腔癌筛查：前瞻性现场评估", "src": "JMIR mHealth and uHealth", "year": 2026, "date": "08-26", "pmid": "42665557", "tags": ["影像", "AI/算法", "临床预测"], "note": "台湾东部602人/4283张口内图前瞻现场评估，红标高危识别灵敏度75%、特异度98.6%、准确率98.5%、AUC 0.957。", "purpose": "评估参数锁定、人工监督下的移动 AI 口腔病变分诊系统在社区口腔癌筛查真实场景中的现场表现。", "design": "台湾东部前瞻性社区现场评估（2025-06-17 至 12-31），602 名受检者、4283 张可判读白光口内图；非专科人员手持移动设备采集，AI 现场质控 + 红/黄/绿三级风险分诊，3 名口腔颌面外科专家共识作参考标准。", "result": "红标高危病变识别灵敏度 75.0%（95%CI 50.5–89.8%）、特异度 98.6%、准确率 98.5%、PPV 17.6%、NPV 99.9%；红/黄/绿分诊 ROC-AUC 0.957/0.931/0.964；专家一致性 Fleiss κ 0.921、Gwet AC1 0.981。", "limit": "低患病率现场下 PPV 偏低（17.6%），仅宜作人工监督下的转诊优先级支持；单地区，需多中心盲法评估、参与者结局与纵向随访。"}, {"g": "A", "title": "大语言模型回答牙髓冲洗剂问题：准确性、幻觉与临床风险的评估", "src": "Journal of Endodontics", "year": 2026, "date": "08-28", "pmid": "42665211", "tags": ["牙体牙髓", "大语言模型", "AI/算法"], "note": "4 款通用 LLM × 100 题（含矛盾诱导题）双盲评分：Claude/Gemini 最准，DeepSeek 幻觉率 29%、16% 回答具致命风险。", "purpose": "评估 4 款通用大语言模型在牙髓冲洗剂（次氯酸钠、EDTA、氯己定等）知识上的准确性、可读性、幻觉亚型与临床风险。", "design": "以文献构建参考集，ChatGPT-5.2 / Claude Sonnet 4.5 / Gemini 3 Pro / DeepSeek 3.2 各答 100 题（80 事实 + 20 矛盾诱导），2 名盲态牙体牙髓专家独立评分，10 天后复测稳定性。", "result": "Claude Sonnet 4.5 与 Gemini 3 Pro 准确率最高（1.75/1.74）、幻觉率最低（7%/9%）；DeepSeek 3.2 准确率最低（1.08）、幻觉率 29%、16% 回答具致命风险；幻觉与临床风险强相关（ρ=0.93）；Gemini 复测稳定性最高（κ=0.95）。", "limit": "仅覆盖冲洗剂主题的体外基准测试，未涉真实临床对话；结论随模型版本迭代可能变化。"}, {"g": "B", "title": "口腔鳞癌与口腔潜在恶性病变的无创检测：诊断准确性伞形综述", "src": "Clinical Oral Investigations", "year": 2026, "date": "08-28", "pmid": "42663684", "tags": ["影像", "AI/算法", "临床预测"], "note": "57 篇系统综述的伞形评价（9 种无创技术）：OCT 诊断准确性最高（灵敏度/特异度 0.91，DOR 108.5），联合 AI 后进一步提升。"}, {"g": "N", "title": "Lupin Dental 完成 1500 万欧元 A 轮：机器人自动化贴面牙体预备", "src": "行业速递 · 资本", "year": 2026, "date": "08-28", "tags": ["资本", "器械/设备"], "note": "法国牙科机器人公司 Lupin（Digicuto SAS，2019 年成立于蒙彼利埃）获私募 Fynveur 领投 1500 万欧元 A 轮（直接注资 1000 万欧元，Bpifrance 提供贷款）。其 Lupin 机器人系统可在牙医监督下自动完成贴面牙体预备；已获印度、英国批准（由 Dolphin Lifesciences 代理销售），尚未获美国/欧盟认证。"}, {"g": "B", "title": "PET/CT 放射组学预测舌鳞癌颈淋巴结转移", "src": "Oral Radiology", "year": 2026, "date": "08-29", "pmid": "42667523", "tags": ["影像", "放射组学", "临床预测", "颌面外科"], "note": "316例舌鳞癌，临床+107个PET/CT放射组学特征逻辑回归预测颈淋巴结转移，AUC 0.88，优于淋巴结SUVmax(0.76)与专家视觉评估(0.79)，外部验证准确率0.80。"}, {"g": "B", "title": "大语言模型生成牙体牙髓参考文献的准确性与错误模式", "src": "Medical Science Monitor", "year": 2026, "date": "08-29", "pmid": "42665969", "tags": ["牙体牙髓", "大语言模型", "AI/算法"], "note": "ChatGPT 5 vs Claude Sonnet 4.6，300条参考文献核验：Claude显著更准(1.79 vs 1.25)，DOI准确率90% vs 35%；提示词特异度影响有限。"}, {"g": "C", "title": "AI 预测无牙颌患者修复后颜面美学", "src": "European Journal of Dentistry", "year": 2026, "date": "08-29", "pmid": "42667931", "tags": ["修复", "AI/算法", "产品"], "note": "14例全口义齿，Gemini/FaceApp模拟戴牙后颜面；美学上可比(专家/患者无显著差异)，但缺乏定量准确性。"}, {"g": "N", "title": "国家药监局发布《牙科学 光固化机》等46项医疗器械行业标准", "src": "行业速递 · 标准", "year": 2026, "date": "08-14", "tags": ["标准", "监管", "器械/设备"], "note": "NMPA 2026年第76号公告(8月14日)发布46项口腔医疗器械行业标准，含《牙科学 光固化机》等，规范牙科器械标准化。"}, {"g": "N", "title": "国产AI医疗器械三类证获批提速，口腔影像AI仍属蓝海", "src": "行业速递 · 审批", "year": 2026, "date": "07-06", "tags": ["审批", "政策", "器械/设备"], "note": "截至2026年中NMPA累计127款AI医用软件证(126款三类)，2026上半年新增13款；获批集中在肺结节/心血管/眼底，口腔影像AI获证仍少、属结构蓝海。"}, {"g": "A", "title": "深度学习 MRI 与病理标志物联合改进舌鳞癌风险分层、指导术后放疗：多中心队列研究", "src": "Radiotherapy and Oncology", "year": 2026, "date": "09-01", "pmid": "42456900", "tags": ["深度学习", "影像", "颌面外科", "临床预测"], "note": "658例训练+419例双中心外部验证；DL-MRI风险评分独立预测OS/DFS，病理深度学习列线图(PDLN) C-index 0.85(OS)/0.76(DFS)；CRIS-OTSCC低危组PORT无生存获益。", "purpose": "整合深度学习(DL)MRI分析与病理标志物，构建更精准的口腔舌鳞癌(OTSCC)风险分层系统，指导术后放疗(PORT)决策。", "design": "回顾性多中心队列；658例术前MRI开发DL模型，419例来自两个独立中心外部验证；将DL风险评分与病理标志物(pT/pN分期、分级、肿瘤出芽)结合构建PDLN与CRIS-OTSCC系统；C-index与时依ROC评估。", "result": "DL模型各队列C-index均>0.700，多因素校正后独立预测OS与DFS(均P<0.001)；PDLN在训练/内部/外部A/外部B队列OS C-index为0.850/0.809/0.804/0.778，DFS为0.763/0.726/0.737/0.736；CRIS-OTSCC低危组PORT不改善OS(HR 0.429, P=0.220)与DFS(HR 0.899, P=0.764)。", "limit": "回顾性设计；PORT获益结论基于观察性亚组分析，需前瞻性随机验证。"}, {"g": "A", "title": "深度学习框架基于全切片图像分类口腔黏膜下纤维化相关口腔鳞癌", "src": "Journal of Dentistry", "year": 2026, "date": "08-31", "pmid": "42674155", "tags": ["深度学习", "影像", "颌面外科", "AI/算法"], "note": "斯里兰卡250例WSI(496万+图像块)训练混合算子MIL模型；内部测试AUC 0.986、AUPRC 0.977；外部20张显微照片19张正确；召回100%/特异度92%。", "purpose": "开发轻量级深度学习框架，基于H&E全切片图像(WSI)区分口腔黏膜下纤维化(OSF)及其相关口腔鳞癌(OSF-OSCC)。", "design": "回顾性研究；156例OSF与94例OSF-OSCC的WSI，80:20划分；200张WSI提取4,966,521个图像块训练并交叉验证混合算子多实例学习(MIL)模型；50张WSI内部测试+20张外部显微照片；评估区分度、校准与净获益。", "result": "内部测试AUC 0.986(95%CI 0.953-1.000)、AUPRC 0.977、Brier 0.034；外部20张中19张分类正确；召回/特异度/精度/平衡准确率/NPV为100%/92%/83.3%/96%/100%；各概率阈值下均有潜在净获益。", "limit": "单中心回顾性数据；外部测试仅20张显微照片而非完整WSI；需多中心前瞻验证。"}, {"g": "A", "title": "引导牙周病学与种植牙医学的AI革命：概念、伦理、问责与可持续采用路线图", "src": "Periodontology 2000", "year": 2026, "date": "08-31", "pmid": "42670718", "tags": ["牙周", "种植", "AI/算法", "监管"], "note": "权威综述(检索至2026年2月)：AI在骨丧失/骨内缺损检测、微生物组分析、种植规划与预后预测等有前景；但单模态单中心数据、外部验证不足、偏倚与可解释性仍是障碍；主张AI定位为临床医生监督下的辅助工具。", "purpose": "系统审视牙周病学与种植牙医学中AI的应用现状、伦理与转化挑战，提出负责任、可持续采用的路线图。", "design": "叙述性综述；检索PubMed、Embase、Cochrane Library至2026年2月；梳理AI应用场景、局限、负责任的实施方法与可持续采用路线图。", "result": "主要应用包括骨丧失检测、骨内缺损检测、生物膜/微生物组分析、患者沟通、术后监测、种植规划、种植体系统识别与预后预测；提升了效率、一致性与可及性，但单模态/单中心/不可共享数据、临床与生物变量整合不足、外部验证缺乏、偏倚/隐私/可解释性担忧构成主要局限。", "limit": "叙述性综述，非系统评价；现有证据以回顾性单模态数据为主，缺乏临床泛化性。"}, {"g": "B", "title": "人工智能与数字印模：利与弊", "src": "Australian Dental Journal", "year": 2026, "date": "08-31", "pmid": "42671088", "tags": ["数字化", "器械/设备", "AI/算法", "修复"], "note": "AI在口扫中提供实时伪影去除、扫描拼接优化与高效三维数据采集；但低置信区间的静默补全/篡改风险值得警惕——推断几何可能看起来解剖学合理却不再是患者的真实记录；呼吁临床医生保持审慎审查。"}, {"g": "B", "title": "AI用于正畸与牙颌面评估(2D/3D面部图像)的诊断性能：系统综述", "src": "International Orthodontics", "year": 2026, "date": "08-31", "pmid": "42673893", "tags": ["正畸", "数字化", "影像", "AI/算法"], "note": "PROSPERO注册系统综述，纳入14项研究：头影测量预测、骨骼模式分类、下颌畸形诊断、正颌手术需求预测等；分类准确率73.1%-97.7%，AUC 0.768-0.987；仅1项真实外部验证，总体证据级别低，定位为专科评估的辅助而非替代。"}, {"g": "B", "title": "通用多模态基础模型检测邻面继发龋的局限", "src": "Odontology", "year": 2026, "date": "08-31", "pmid": "42671523", "tags": ["大语言模型", "影像", "牙体牙髓", "AI/算法"], "note": "零样本测试GPT-5o与Gemini 2. DiamondClean 9900 Prestige：首款端侧 AI 电动牙刷 9 月开售", "src": "行业速递 · 产品", "year": 2026, "date": "09-01", "tags": ["产品", "器械/设备"], "note": "飞利浦 Sonicare 首款搭载端侧 AI（第三代 AI/ML + 空间感知引导）的电动牙刷：光环实时显示覆盖/压力/摩擦行为，12 分区 Mouth Map 提示漏刷部位，SenseIQ 压力传感在用力过大时自动调节强度，官方称较手动牙刷可多清除最高 2000% 菌斑；9 月起经 Amazon 开售。消费级口腔 AI 设备走向“端侧智能 + 实时反馈”，无需依赖手机 App。"}, {"g": "N", "title": "Trust AI 推出牙科 RCM 中枢：种植理赔引入专家审核与实时保险商通话", "src": "行业速递 · 产品", "year": 2026, "date": "09-02", "tags": ["产品", "AI/算法"], "note": "旧金山牙科 AI 公司 Trust AI 宣布推出 Dental RCM Hub，并与 Wehrle Implant Immersion Center 合作：每份种植相关理赔申请将加入种植专家（教员）审核与实时保险商通话，缓解牙科保险核销的人力瓶颈，体现牙科 AI 从影像诊断向收入周期管理（RCM）延伸。"}, {"g": "A", "title": "牙科→内科会诊转诊信自动生成：Gemini-2.5-Pro / GPT-5 / MedGemma 比较研究", "src": "International Dental Journal", "year": 2026, "date": "09-03", "pmid": "42691762", "tags": ["大语言模型", "数字化", "AI/算法"], "note": "153 组配对数据、标准化提示词生成牙科→内科转诊信，2 名牙科临床医师盲评 9 维度：Gemini-2.5-Pro 总均分最高（2.9487）显著优于 GPT-5（2.8818）与 MedGemma（2.8613）；GPT-5 自评与人工判断偏离，提示模型自评偏倚。", "purpose": "评估大语言模型（LLM）自动生成牙科→内科转诊信（面向伴全身疾病的牙科患者）的临床可行性与生成质量。", "design": "153 组配对数据集；Gemini-2.5-Pro、GPT-5、MedGemma 在标准化提示词框架下生成转诊信；2 名牙科临床医师盲评 9 项子标准（内容/风格/正确性），GPT-5 另做自动化自评对照；Friedman + Wilcoxon（Holm 校正）检验。", "result": "人工评价 Gemini-2.5-Pro 总均分最高（2.9487，95%CI 2.9345–2.9606），显著高于 GPT-5（2.8818，95%CI 2.8613–2.9008）与 MedGemma（2.8613）（均 P<.05）；GPT-5 与 MedGemma 差异不显著（P=.3519）；GPT-5 自评结果偏离人工判断，提示模型自评存在偏倚；独立测试集评分者间一致性低（QWK 0.1505）。", "limit": "临床文书评估主观性高（测试集 QWK 仅 0.1505）；进入常规临床应用前需更大规模系统研究。"}, {"g": "B", "title": "AI 辅助 CBCT 分析在牙槽嵴保存术中的应用：叙述性综述", "src": "European Journal of Dentistry", "year": 2026, "date": "09-03", "pmid": "42692081", "tags": ["种植", "影像", "器械/设备", "AI/算法"], "note": "33 篇纳入（17 项 AI 主研究）：AI 牙体/牙槽骨分割 Dice 稳定 >0.90 且耗时显著缩短、部分架构跨设备泛化；但无研究把 AI 输出与种植体存活/美学/并发症等患者结局关联，仅 4 项独立外部验证——技术精度 ≠ 临床获益。"}, {"g": "B", "title": "修复学中的人工智能系统：当前应用与挑战", "src": "Australian Dental Journal", "year": 2026, "date": "09-02", "pmid": "42687376", "tags": ["修复", "数字化", "器械/设备", "AI/算法"], "note": "叙述性综述把修复 AI 系统分为 5 类（影像处理标注/分类决策/可视化建模/优化仿真/记录沟通）；可用于 CAD/CAM 修复体边缘勾画、口扫数据自动冠修复设计生成与患者沟通；挑战集中在自动化偏倚、可解释性与治疗失败责任归属。"}, {"g": "B", "title": "闭环多模态 AI 发现表面活性抗菌肽：种植体抗菌涂层的计算-验证一体化框架", "src": "Langmuir (ACS)", "year": 2026, "date": "09-01", "pmid": "42689642", "tags": ["材料", "种植", "AI/算法"], "note": "仅 122 条表面固定态实验序列训练多模态分类器即达 AUC 0.989 / F1 0.941；78.9 万生成序列中选 15 个候选做钛表面共价接枝验证：高活性组对铜绿假单胞菌减少 82.9%–91.3%，显著优于低活性对照（38.6%–50.5%），计算与实测高度吻合。"}, {"g": "C", "title": "大语言模型作答牙科专科考试：土耳其 DUS 1026 题的 5 模型比较", "src": "European Journal of Dental Education", "year": 2026, "date": "09-03", "pmid": "42691237", "tags": ["大语言模型", "AI/算法"], "note": "13 届 DUS（2012–2021）1026 道临床题：总体准确率 79.2%–90.6%，Gemini 3.5 Flash（90.6%）与 ChatGPT-5（88.2%）最高且最稳，Copilot / DeepSeek-R1 / Grok 4 显著落后（p<0.001）；口腔颌面外科、儿牙、牙周、牙体修复类表现最好。"}, {"g": "C", "title": "为「智能体牙科」做好准备？自主 AI 对口腔诊疗的影响", "src": "International Dental Journal", "year": 2026, "date": "09-03", "pmid": "42691769", "tags": ["AI/算法", "大语言模型", "监管"], "note": "Perspective 提出 agentic dentistry 概念框架：自主 AI（如医疗推理体 MEDRA 类）可增强纵向临床推理与患者管理，但科学验证、伦理、教育、监管与职业边界挑战未决；倡议在临床普及前建立研究与政策议程。"}, {"g": "C", "title": "开放 TMJ 手术临床问题：五款生成式 AI 聊天机器人的指南对照评估", "src": "Journal of Stomatology, Oral and Maxillofacial Surgery", "year": 2026, "date": "09-02", "pmid": "42685976", "tags": ["大语言模型", "颌面外科", "AI/算法"], "note": "8 领域 40 问 × 5 平台（ChatGPT-5.5 / Claude Opus 4.8 / Gemini 3.1 Pro / Grok 4 / Perplexity Pro）共 200 响应，2 名口外医师盲评（ICC 0.93–0.99）：Perplexity QAMAI 总分最高（27.5±1.4）、Claude GQS 最高（4.5±0.6）、Grok 最低；Claude/Gemini 可读性差（中位 FKGL 22.7/26.1），临床使用前须专科核实。"}, {"g": "C", "title": "远程牙科在各专科的应用：系统综述与 Meta 分析", "src": "Journal of Dentistry (Shiraz, Iran)", "year": 2026, "date": "09-01", "pmid": "42688783", "tags": ["数字化", "AI/算法"], "note": "修复科 4 项研究可行 Meta 分析：智能手机影像诊断灵敏度 77.2%（95%CI 62.5–87.4）、特异度 89.1%（70.5–96.5），异质性高（I²=68%/92%）但敏感性分析稳健；正畸/修复有前景、牙体牙髓受限；现有数据不足以支持 AI 与远程牙科结合的正面结论，呼吁标准化验证。"}, {"g": "N", "title": "Pearl 发布 Second Opinion 3D：FDA 获批 CBCT AI 首次落地全科牙医（美/加）", "src": "行业速递 · 产品", "year": 2026, "date": "09-03", "tags": ["产品"], "note": "Pearl 宣布 Second Opinion 3D 正式商用：将其此前获 FDA 510(k)、同时覆盖 2D 与 3D 放射影像分析的 CBCT AI（Pearl 为 FDA 首个 2D+3D 双模态获批的牙科 AI 公司）带给美国与加拿大全科牙医。产品自动分割下颌骨、上颌复合体、鼻腔、气道、下牙槽神经管与牙齿，提供交互式 3D 渲染/缩放/透明度/长度测量；新增两大全科工作流：内置专科放射报告请求、CBCT 发现自动转换为保险理赔文档。定位是让 CBCT 从专科工具变为全科日常诊疗入口，并衔接口腔-全身健康。"}, {"g": "B", "title": "龋病风险评估的预测准确性：系统综述（含机器学习方法）", "src": "Journal of Dentistry", "year": 2026, "date": "09-04", "pmid": "42697261", "tags": ["牙体牙髓", "AI/算法", "临床预测"], "note": "更新2015版综述：7332条记录纳入30项研究（16项Meta）。儿童Cariogram合并灵敏度72.1%/特异度70.0%；CAMBRA 67.7%/59.0%（异质性高）；AAPD CRA灵敏度95.6%但特异度仅5.1%（宜筛查不宜分层）；ML方法有潜力但数据不足未合并。CRA总体准确性中等，应结合临床判断使用。", "purpose": "评估单因素、多因素与机器学习类龋病风险评估（CRA）方法在儿童与成人龋病风险预测中的准确性，更新2015年综述。", "design": "PRISMA 2020+预后准确性条目；检索PubMed/WoS/Cochrane/Embase/Scopus（2015-02至2025-07）；纳入随访≥1年且可重建2×2表的研究；7332条记录中30项纳入、16项Meta分析。", "result": "儿童完整Cariogram合并灵敏度72.10%、特异度69.96%；CAMBRA灵敏度67.65%、特异度58.96%（异质性显著）；AAPD CRA灵敏度95.56%但特异度仅5.12%，更适合作初筛而非风险分层；既往龋经历预测准确性中等；机器学习显示潜力但缺乏足够数据合并。", "limit": "各工具/人群/研究设计间变异性大；ML-CRA证据仍匮乏；建议CRA与临床判断并用，期待前瞻验证与客观生物标志物整合。"}, {"g": "B", "title": "深度学习增强CT分类腮腺肿瘤：超越临床与影像评估的关键诊断信息", "src": "Oral Oncology", "year": 2026, "date": "09-04", "pmid": "42696858", "tags": ["颌面外科", "影像", "深度学习"], "note": "66例（33恶性+33良性，人口学匹配）CE-CT三维CNN：AUC 0.94、最优阈值下灵敏度与特异度均>90%，优于常规临床+影像工作流（60.6%）及加FNAC/CNB后（69.7%）。", "purpose": "评估三维卷积神经网络基于增强CT（CE-CT）术前区分腮腺肿瘤良恶性的诊断价值，并与常规临床、影像及穿刺工作流对比。", "design": "回顾性研究：2008–2024年66例腮腺切除患者（33恶性+33良性匹配）；肿瘤体积分割后输入3D CNN；对照标准临床与影像检查（含FNAC/CNB）。", "result": "常规临床+影像工作流灵敏度60.6%，加FNAC/CNB后69.7%；DL模型AUC 0.94，最优阈值下灵敏度与特异度均>90%，显著优于常规诊断。", "limit": "单中心、小样本（66例）回顾性；良性亚型异质性与罕见恶性肿瘤覆盖有限，需多中心前瞻验证。"}, {"g": "C", "title": "多模态大语言模型解读牙科病历图表：面向学生与临床医生的基准测试", "src": "JMIR Medical Education", "year": 2026, "date": "09-04", "pmid": "42696739", "tags": ["大语言模型", "数字化", "AI/算法"], "note": "首尔大学牙科医院15例病历图表（154张截图、360问、四类任务）：GPT-5 Thinking中位SBERT相似度0.900最高（GPT-5 Pro 0.861、o3 0.831）；多数题型与学生无显著差异、部分低于一年级住院医，多条目综合类普遍困难。宜作受监督教学工具而非替代临床判断。", "purpose": "基准测试多模态ChatGPT模型解读牙科电子病历图表图像的能力，并与牙科学生、住院医表现对比。", "design": "回顾性横断面基准研究；15例患者图表（2017–2025，韩英双语）154张截图；24问/例共360问，分四类（A事实检索/B牙位与程序检索/C多条目综合解释/D信息缺失弃答）；9个多模态ChatGPT模型；人类基线2名三年级学生+2名一年级住院医；SBERT相似度为主指标并辅以临床准确性内容分析。", "result": "GPT-5 Thinking中位SBERT 0.900最高，其后GPT-5 Pro（0.861）与o3（0.831）（P<.001）；与多数题型学生无显著差异（仅一名学生在D类显著更低），部分A/B/C类低于住院医；C类综合任务精确匹配率低；临床参考一致性高（AC1=0.99），临床准确率排序与SBERT高度一致（ρ=0.90）。", "limit": "单中心、单图表系统与语种（韩英）；模型版本迭代快；需跨机构、专科与记录系统的外部验证。"}, {"g": "C", "title": "GenAI 聊天机器人如何传达氟化物信息：可读性与负面框架分析", "src": "JDR Clinical and Translational Research", "year": 2026, "date": "09-04", "pmid": "42695526", "tags": ["大语言模型", "AI/算法"], "note": "5款免费GenAI聊天机器人×3沟通场景，1326句标注中286句（21.6%）为负面框架，事实核查场景负面占比更高；负面主题集中于氟斑牙、儿童过量暴露、毒性、神经发育担忧、氟骨症等风险导向内容；结构化提示改善多数可读性指标但仍处困难水平，恐阻碍公众理解循证防龋建议。", "purpose": "评估GenAI聊天机器人输出的氟化物相关健康信息的可读性，并刻画负面框架内容的占比与主题模式。", "design": "横断面信息流行病学研究；5款免费可及的GenAI聊天机器人；事实核查/观点/解释3类沟通场景×有机/结构化2种提示格式；句子级双人独立标注（正面/中性/负面）；多指数可读性评估+主题建模。", "result": "1326句中286句（21.6%）负面框架；负面占比在聊天机器人与提示格式间无显著差异，但随场景变化——事实核查提示负面内容更高；负面句围绕氟斑牙、儿童过量暴露、毒性、神经发育与氟骨症等风险主题；结构化提示提升多数可读性指标，但整体仍属困难阅读水平。", "limit": "横断面快照，模型输出随版本变化；句子级标注含主观成分；对临床沟通与公共卫生的实际影响需进一步研究。"}, {"g": "C", "title": "WebCeph 与人工头影测量的一致性：唇腭裂与非唇腭裂患者比较", "src": "Health Science Reports", "year": 2026, "date": "09-03", "pmid": "42694339", "tags": ["正畸", "数字化", "产品", "AI/算法"], "note": "45例完全性单侧唇腭裂+30例对照侧位片：WebCeph失败率22.6%；ICC 0.332–0.845——SNB/ANB一致性良好、SNA/U1-SN中等，下颌角/IMPA/鼻唇角差；两组差异模式与幅度相近，提示算法性局限为主因。AI头影测量宜作辅助而非替代人工描记。", "purpose": "评估AI云端头影测量软件WebCeph与人工描记在完全性单侧唇腭裂（CUCLP）患儿中的一致性，并与非唇腭裂对照比较差异模式。", "design": "回顾性方法比较研究；75张侧位片（45例修复后CUCLP+30例年龄匹配对照，8–12岁）；14个标志点、7项角度测量；WebCeph vs 人工描记；ICC评估一致性、Dahlberg公式计算测量误差。", "result": "WebCeph失败17/75（22.6%），唇腭裂组（22.2%）与非唇腭裂组（23.3%）相近；ICC 0.332–0.845：SNB、ANB良好，SNA、U1-SN中等，下颌角、IMPA、鼻唇角差；唇腭裂组下颌角/鼻唇角/U1-SN/IMPA、对照组SNA差异显著；两组差异幅度无显著差别，提示算法性局限是主要因素。", "limit": "单中心小样本（58张可分析）；唇腭裂相关解剖影响无法完全排除；需更大样本与更多AI软件验证。"}, {"g": "C", "title": "通用多模态 AI 对下颌阻生第三磨牙 Pell-Gregory 分类的准确性", "src": "Cureus", "year": 2026, "date": "09-03", "pmid": "42694521", "tags": ["影像", "大语言模型", "颌面外科"], "note": "100张全景片（94例住院医共识+专科医师确认作金标准）：ChatGPT-5.2正确率20.2%、Grok 4.1为18.1%，仅略高于九分类随机期望（11.1%），两模型差异无统计学意义；通用AI尚不能独立承担阻生智齿分类，不应替代专科判读。", "purpose": "评估通用多模态AI平台（ChatGPT、Grok）在全景片上按Pell-Gregory系统分类下颌阻生第三磨牙的准确性，以住院医共识+专科医师确认为参考标准。", "design": "100张阻生下颌第三磨牙全景片由2名盲态住院医独立分类（一致率94%、κ=0.925），94例共识分类经口腔颌面放射专科医师确认作金标准；每张图经付费版ChatGPT-5.2与Grok 4.1独立新会话分类；McNemar检验比较模型。", "result": "ChatGPT正确19/94（20.2%，95%CI 12.1–28.3%）、Grok 17/94（18.1%，95%CI 10.3–25.9%），均仅略高于随机期望11.1%；McNemar检验无显著差异（χ²=0.045，p=0.832）。", "limit": "通用聊天界面评测、未做放射学专用提示优化；单一中心小样本；结果不能外推到专用医学影像AI。"}, {"g": "N", "title": "罗切斯特大学获 NIH 310 万美元：开发诊所外的 AI 口腔疾病筛查平台", "src": "行业速递 · 资本", "year": 2026, "date": "09-04", "tags": ["融资", "器械/设备", "AI/算法"], "note": "NIDCR（NIH）提供五年310万美元资助罗切斯特大学Eastman口腔健康研究所：推进SMARTeeth++——便携口内成像+AI分析检测龋齿与早期牙周病，并整合患者健康信息构建疾病进展风险预测模型，目标是在传统牙科诊所之外实现口腔疾病检测与早期干预（09-04报道）。"}, {"g": "B", "title": "口咽鳞癌 HPV 检测方法比较与转录活性病毒载量的预后价值（含深度学习辅助分析）", "src": "Oral Oncology", "year": 2026, "date": "09-04", "pmid": "42696859", "tags": ["颌面外科", "AI/算法", "深度学习"], "note": "207例头颈鳞癌（HNSCC）存档组织：GP5+/GP6+ PCR、p16 多重免疫组化与 CISH（E6/E7 mRNA）三法互证，QuPath 定量病毒载量，另验证独立深度学习 HPV 预测算法（H&E 切片）；HPV-DNA 仅见于口咽鳞癌亚组，三种方法与金标准 PCR 诊断性能相当；转录活性病毒载量是校正年龄/分期/生活方式后的独立总生存预后因子。", "purpose": "比较多种 HPV 检测方法并评估转录活性病毒载量在存档 HNSCC 组织中的预后价值，同时验证基于 H&E 切片的深度学习 HPV 预测算法。", "design": "回顾性队列，207 例 HNSCC 构建组织微阵列（TMA）；GP5+/GP6+ PCR 检测 HPV-DNA 并分型；多重免疫组化检测 p16、CISH 检测 E6/E7 mRNA；QuPath 定量病毒载量；独立深度学习算法在 H&E 组织核心上验证；ROC 比较各方法诊断性能，Cox 回归评估预后。", "result": "多方法组合可准确识别原发灶与转移灶中的转录活性 HPV（含 >20 年存档组织）；HPV-DNA 仅存在于口咽鳞癌，其他头颈亚区均阴性；三种检测方法诊断性能与金标准 PCR 相当；病毒载量在校正年龄、分期与生活方式后仍为总生存的独立预测因子。", "limit": "回顾性单中心队列；口咽癌亚组样本量有限；深度学习算法为辅助验证性质，尚需前瞻、多中心外部验证后再推广。"}, {"g": "C", "title": "机器学习驱动的食管癌与唇/口腔癌共负担分析：203 个国家与地区老年人群的时空模式与风险因素", "src": "Annals of Medicine", "year": 2026, "date": "09-05", "pmid": "42693829", "tags": ["AI/算法", "临床预测"], "note": "GBD 2021 数据（≥55 岁、203 国）：随机森林 + SHAP 从 58 个候选暴露中筛选 36 个，VIF 后 25 个进入负二项模型；国家被分为一致型（73）、食管癌主导型（61）与唇/口腔癌（LOC）主导型（69）；酒精与低坚果种子饮食对两癌均为共同风险因素，LOC 另与嚼烟（RR 1.32）、高钠饮食（RR 1.10）相关；生态学证据，不能推及个体因果。", "purpose": "刻画老年人食管癌与唇/口腔癌（LOC）在国家层面的共负担时空格局，并借助机器学习识别相关的群体暴露因素。", "design": "基于 GBD 2021、≥55 岁、203 个国家与地区；发病率按四分位划分共负担类别并与 1990–2021 趋势及 SDI 轨迹比较；随机森林 + SHAP 从 58 个候选暴露排序，经 VIF 筛选后 25 个进入带人口偏移的多元负二项模型。", "result": "73 国为两癌一致负担、61 国食管癌主导、69 国 LOC 主导；SDI 升高伴随食管癌下降而部分高 SDI 地区 LOC 上升；酒精（食管 RR 1.32、LOC RR 1.27）与低坚果种子饮食为共同风险，LOC 特异风险包括嚼烟（RR 1.32）与高钠饮食（RR 1.10）。", "limit": "生态学研究，暴露-结局为国家层面关联而非个体因果；机器学习排序依赖数据质量与模型设定；需结合个体层面研究验证。"}, {"g": "C", "title": "世界正畸医师联合会全球指南：患者指导与急诊处理共识框架（含远程正畸与 AI 的伦理整合）", "src": "J World Fed Orthod", "year": 2026, "date": "09-03", "pmid": "42692930", "tags": ["正畸", "监管", "AI/算法"], "note": "WFO 首份面向国际的正畸患者指导与急诊处理共识：六大洲 13 国专家多阶段盲法共识；覆盖风险沟通与知情同意、口腔卫生与矫治器护理、急诊/紧急/小事件分诊、正颌等围手术期指导、保持与长期监测，以及远程正畸与 AI 的伦理整合——数字工具辅助沟通但不替代临床监督；供各地机构制定本地化协议与质量指标。", "purpose": "为正畸患者指导与急诊/紧急处理提供首个国际共识框架，明确健康素养敏感、文化可适应且伦理稳健的沟通原则，并为 AI/远程正畸的临床整合划定边界。", "design": "来自 6 大洲 13 国的正畸专家小组，采用多阶段盲法共识流程并辅以外部评审；综合证据、临床经验与最佳实践形成跨领域建议。", "result": "形成涵盖风险沟通与知情同意、口腔卫生与矫治器护理、急诊分诊与管理、围手术期咨询、保持与长期监测及 AI/远程正畸伦理整合的全球性框架；强调以数字工具支持而非替代临床监督。", "limit": "共识性指导文件，多数领域的直接证据有限；AI 与远程正畸部分为原则性建议，落地效果尚待本地化实施与质量审计验证。"}, {"g": "N", "title": "21D 在美国发布 ArchOS：AI 驱动的全口种植修复规划与执行平台", "src": "行业速递 · 产品", "year": 2026, "date": "09-03", "tags": ["产品", "器械/设备", "种植"], "note": "21D 宣布 ArchOS 平台在美国上市：医生上传 CBCT + 口内扫描 + 面部扫描，AI 自动分割解剖结构、跨模态配准、规划骨修整与植体位置并设计修复体，约 16 分钟返回完整方案；方案确认后 21D 制造含外科导板、植体与修复组件的患者定制套件，约 3 周交付；手术约 3 小时一次就诊完成，当日戴入钛加强最终修复体，约 6 周后再戴精修的第二副。平台不直接零售：医生需完成在线评估、理论课程及英国 21D 基地实操培训的认证授权路径，初期计划授权约 50 名美国牙医——「AI 规划 + 中央制造 + 授权认证」的全口种植新模式，值得关注其 FDA/监管路径与临床结果证据。"}, {"g": "N", "title": "FDA 发布牙科复合树脂与光固化灯 510(k) 最终指南；国内 YY 0055-2026 配套推进", "src": "行业速递 · 审批", "year": 2026, "date": "09-02", "tags": ["审批", "标准", "材料", "器械/设备"], "note": "9 月 2 日联邦公报（91 FR 56452）公布两份最终指南（Docket FDA-2024-D-2511/2512），对牙科复合树脂与光固化灯的设备描述、非临床/临床性能测试及标签给出申报推荐，并引用最新 ISO/IEC 标准以统一口径；国内 NMPA 同步推进《牙科学 光固化机》YY 0055-2026，计划 2029-08-01 实施。树脂材料与固化灯类厂商的 510(k)/注册申报路径受影响直接。"}, {"g": "N", "title": "国家医保局：试行医疗服务价格项目「预立项」制度，创新器械提前介入定价", "src": "行业速递 · 政策", "year": 2026, "date": "09-04", "tags": ["政策", "器械/设备"], "note": "医保部门将对新技术（进入临床研究）或新产品（进入创新医疗器械特别审查程序至正式获批前）提前介入价格立项，试行「预立项」制度；叠加 1 月《手术和治疗辅助操作类价格立项指南》中导航/参与执行/精准执行三类机器人价格项目，口腔种植机器人、手术导航等创新器械的价格与收费通道有望更早打通。"}, {"g": "S", "title": "机器学习诊断牙周炎：唾液与龈上菌斑优于龈下——33队列2303例基准评测", "src": "Journal of Dental Research", "year": 2026, "date": "09-07", "pmid": "42703634", "tags": ["牙周", "口腔微生物", "AI/算法", "临床预测"], "note": "整合33个公共16S rRNA项目、2303例成人样本，系统比较唾液/龈上/龈下菌斑三种采样生境+多种ML建模对牙周炎的诊断价值：GAM以6–12个ASV紧凑面板最优，唾液(AUC 0.928)与龈上(0.903)显著优于临床常用的龈下菌斑(0.803)，DCA显示唾液临床净获益最高；48个可注释ASV构成预测特征，龈下以健康共生菌为主、龈上/唾液以牙周致病菌为主——支持以唾液等无创采样做可推广的牙周筛查。", "purpose": "系统比较不同口腔微生态采样生境与机器学习建模策略对牙周炎的诊断效能，确定最适于临床决策的无创采样-建模组合。", "design": "整合33个公共16S rRNA V3-V4测序项目、2303例成人样本（唾液/龈上/龈下菌斑）；ASV比对扩展人类口腔微生物组数据库；sPLS-DA+定制遗传算法筛选特征，5种机器学习算法在重复交叉验证与独立测试集上评测；AUC为主指标+DCA评估临床净获益。", "result": "GAM以6–12个ASV的紧凑面板取得最佳判别：唾液AUC 0.928（灵敏度92.4%/特异度85.3%）、龈上0.903，均显著优于龈下菌斑0.803（校正P≤0.001）；DCA唾液净获益最高（0.437），其次龈上(0.419)、龈下(0.331)；48个可注释ASV作为预测特征并具生物学可解释性。", "limit": "基于公共回顾性16S数据，跨项目批次异质性较大；需前瞻性床旁/即时检验（POC）与靶向PCR进一步验证。", "purpose2": ""}, {"g": "A", "title": "深度学习预测二硅酸锂贴面最终颜色：目标驱动的贴面-试戴糊剂智能筛选", "src": "Journal of Dentistry", "year": 2026, "date": "09-07", "pmid": "42705446", "tags": ["修复", "材料", "深度学习", "数字化"], "note": "制作7色×3厚度二硅酸锂贴面，以2套商用试戴糊剂+29个VITA 3D-MASTER比色片模拟粘接/基牙-目标色场景：FCNN（12个色彩学输入）预测最终CIELAB色，测试集平均ΔE00=0.50±0.27，100%低于可接受阈值(1.8)、87.5%低于可感知阈值(0.8)；对841个基牙-目标色场景×210个候选组合做目标驱动筛选，267个场景找到514个可接受组合，实测复核87.16%仍低于ΔE00 1.8——为数字化美学修复的术前材料选配提供量化工具。", "purpose": "建立深度学习框架预测二硅酸锂陶瓷贴面的最终颜色，并开发目标驱动的筛选算法，为不同基牙-目标色场景推荐并排序贴面-试戴糊剂组合。", "design": "体外制作7色×3厚度二硅酸锂贴面试件；2套商用试戴糊剂与29个VITA Linearguide 3D-MASTER色标分别模拟粘接与基牙/目标色；光谱反射率转换为CIELAB坐标；含批归一化+ReLU的全连接神经网络（FCNN）以12个材料色彩学输入预测层叠贴面组件的最终色；841个基牙-目标色场景×210个候选组合筛选，并用实测最终色数据复核。", "result": "测试集FCNN平均ΔE00=0.50±0.27，100%预测低于AT(1.8)、87.5%低于PT(0.8)；267个场景找到临床可接受组合（514个排序候选）；实测复核平均ΔE00=0.55±0.40（预测vs实测）、1.22±0.51（实测vs目标色），87.16%的候选组合仍低于AT。", "limit": "材料库局限于2套试戴糊剂与固定色/厚度范围；体外试件未完全模拟临床粘接、老化与口腔环境；需临床病例扩展验证。", "purpose2": ""}, {"g": "A", "title": "FS-T2WI 放射组学鉴别腮腺肿瘤良恶性：TabResNet 优于传统机器学习并获多阅片者验证", "src": "Journal of Cranio-Maxillo-Facial Surgery", "year": 2026, "date": "09-07", "pmid": "42705054", "tags": ["颌面外科", "影像", "放射组学", "深度学习"], "note": "102例病理确诊腮腺肿瘤：从FS-T2WI提取放射组学特征，对比4种传统ML（LR/梯度提升/RF/LightGBM）与4种表格深度学习（TabResNet/DCNv2/AutoInt/TabNet）；独立测试集上TabResNet最高AUC 0.8913，优于最佳传统模型RF（0.8641）；多阅片者试验显示模型辅助可提升不同年资/专业背景医生的诊断表现与阅片效率——支持表格深度学习作为临床放射组学建模的实用框架。", "purpose": "评估FS-T2WI放射组学特征结合传统机器学习与表格深度学习模型对腮腺肿瘤良恶性的术前鉴别性能与临床效用。", "design": "102例病理确诊腮腺肿瘤的FS-T2WI影像；构建4种传统ML+4种表格DL模型；独立留出测试集评估，5折交叉验证仅用于特征筛选阶段的优化正则化参数选择；以AUC为主指标，辅以DCA与多阅片者试验。", "result": "TabResNet在独立测试集取得最高AUC 0.8913，优于最佳传统ML（RF AUC 0.8641），泛化与临床效用更强；其余3种DL架构判别力可接受但未带来持续临床获益；多阅片者试验证实模型辅助提升不同年资与专业背景医生的诊断表现和阅读效率。", "limit": "单中心、样本量中等（102例）；仅FS-T2WI单序列放射组学；缺乏外部多中心验证。", "purpose2": ""}, {"g": "B", "title": "AI 检测继发龋的诊断准确性：系统综述与 Meta 分析", "src": "Caries Research", "year": 2026, "date": "09-07", "pmid": "42704746", "tags": ["牙体牙髓", "影像", "AI/算法"], "note": "PROSPERO注册(CRD420251014888)：检索PubMed/EBSCOhost/Scopus/Embase/IEEE Xplore/Web of Science至2026-06-11，筛得9项研究进入Meta分析；合并灵敏度76.83%（95%CI 51.70–91.13）、特异度84.43%（29.06–98.63），HSROC AUC 0.85（0.81–0.88），异质性59.47%——AI检测继发龋具中等偏上的诊断效能，但证据体有限、异质且3项研究在待评价试验域存在高偏倚风险，临床落地仍需更强验证。"}, {"g": "C", "title": "人工智能在头颈外科中的作用：叙述性综述（含口腔颌面外科应用）", "src": "Turkish Journal of Surgery", "year": 2026, "date": "09-07", "pmid": "41987590", "tags": ["颌面外科", "AI/算法"], "note": "检索2000-01至2025-07 PubMed/Scopus/Google Scholar的叙述性综述：梳理AI/DL/ML在头颈外科（耳鼻喉、口腔颌面、整形等共同实践领域）的肿瘤检测、术前决策、手术规划与康复应用；同时提示患者隐私、数据安全、复杂决策中共情缺失等伦理问题，主张以跨学科监管框架约束而非整体弃用——综述性质、以头颈外科整体视角为主，口腔颌面部分占比有限。"}, {"g": "N", "title": "戴森发布 499 美元 AI 摄像电动牙刷 CameraJet：机内视觉识别牙缝并自动喷射漱口液", "src": "行业速递 · 产品", "year": 2026, "date": "09-01", "tags": ["产品", "器械/设备", "AI/算法"], "note": "9月1日起在美国等市场发售（$499.99，英/法/澳/日同步上架）：内置10万像素微距摄像头以28帧/秒分析画面，Gap Optical Targeting系统检测、跟踪并预测牙间缝隙，刷牙时自动向牙缝喷射最高0.15mL漱口液；影像默认在设备端处理、不存储不上云，仅用户可选实时画面流至MyDyson App并提供覆盖率地图与刷牙反馈。厂商未申报FDA、按消费级电动牙刷销售——AI影像进入口腔护理消费硬件的信号值得关注，但喷射清洁的临床依据仍待验证（Cochrane对水牙线类辅助证据本就有限），隐私与售后维修政策亦需审视。"}, {"g": "N", "title": "美国签署临时拨款法案：口腔健康与牙科研究经费维持至 12-11（NIDCR 5.25 亿美元）", "src": "行业速递 · 政策", "year": 2026, "date": "09-04", "tags": ["政策"], "note": "总统签署《2027持续拨款与延期法案》：联邦机构按FY2026水平维持拨款至12月11日，口腔相关包括NIDCR 5.25亿美元、CDC口腔健康项目2100万、HRSA口腔人力项目4300万、IHS牙科项目2.6亿等；同时至少推迟至12-11后实施OMB联邦拨款审查改革提案。美国口腔研究资助短期趋稳，对NIDCR资助的口腔AI/影像研究是利好，但12月仍有下一轮预算博弈。"}, {"g": "A", "title": "AI 辅助全景片龋病检测的多中心评估：低年资牙医灵敏度、效率与一致性显著提升", "src": "International Dental Journal", "year": 2026, "date": "09-08", "pmid": "42710159", "tags": ["影像", "牙体牙髓", "AI/算法", "器械/设备"], "note": "12名低年资牙医(≤3年)+3名高年资(>10年)在4种条件下判读402张匿名全景片：AI辅助使牙位级灵敏度67.4%→82.4%(P<.001)且特异度基本不变(97.2%→97.4%)，平均判读时间65.12→50.37秒(P=.003)，病例级灵敏度84.7%→93.3%，阅片者一致性κ0.61→0.73；AI单独灵敏度79.2%、特异度98.4%、AUC 0.938——AI辅助可缩小经验相关差异，尤其利于缺乏上级带教的低年资/基层场景。", "purpose": "评估 AI 辅助诊断工具对低年资牙医在全景片上龋病检出的准确性、效率与阅片一致性的影响（多中心设计）。", "design": "多中心阅片者研究：12 名低年资牙医（≤3 年经验）与 3 名高年资牙医（>10 年）在 4 种条件下（独立阅片、AI 辅助、仅 AI、专家参考）独立判读 402 张匿名全景片；以 3 名资深牙医像素级标注的专家参考标准为准，比较灵敏度、特异度、AUC、判读时间与阅片者间一致性。", "result": "AI 辅助使牙位级灵敏度由 67.4% 升至 82.4%（P<.001），特异度不受损（97.2%→97.4%）；平均判读时间由 65.12 秒降至 50.37 秒（P=.003）；病例级灵敏度 84.7%→93.3%（P<.001）；阅片者间一致性 κ 0.61→0.73；AI 单独灵敏度 79.2%、特异度 98.4%、AUC 0.938。", "limit": "参考标准基于资深专家像素级标注而非组织学金标准；仅全景片单模态龋病任务，未覆盖根尖片/口内照；低年资样本量有限，未纳入真实接诊负荷与设备差异。"}, {"g": "B", "title": "CBCT 下颌管 AI 分割的系统综述与 Meta 分析：合并 DSC 0.806，异质性极高、证据确定性低", "src": "Oral Radiology", "year": 2026, "date": "09-08", "pmid": "42709366", "tags": ["影像", "种植", "AI/算法", "器械/设备"], "note": "系统检索PubMed/Scopus/WoS/Cochrane/Wiley至2026-04-10：59项定性、46项定量纳入；40个效应量合并DSC 0.806（95%CI 0.773–0.839）、IoU 0.757、HD95 2.085mm、平均距离误差0.498mm；异质性极高(I²=99.68%)，验证策略与AI架构亚组无显著差异，仅发表年份显著；QUADAS-2偏倚风险+GRADE证据确定性低——CBCT下颌管AI分割性能可观，但应定位为辅助工具，距可靠临床落地仍需外部验证与标准化方法学。"}, {"g": "B", "title": "牙科影像 AI 发展管线述评：从数据集设计到临床转化", "src": "Oral Radiology", "year": 2026, "date": "09-07", "pmid": "42706458", "tags": ["影像", "AI/算法", "监管"], "note": "叙述性综述覆盖全景片、口内片、CBCT 与口扫的 AI 开发全流程：数据集构建与标注规范、模型开发、验证与临床转化；指出数据集异质性、标注不一致、域偏移、信息泄漏、可解释性与监管要求仍是临床采纳的主要障碍，多模态学习与基础模型是提升泛化性的潜在方向——为影像 AI 器械研发提供数据集设计与验证策略层面的方法学清单。"}, {"g": "B", "title": "六种大语言模型应答牙颈部外吸收（ECR）结构化问题：高准确率、跨账号/跨日稳定，分类题仍最易错", "src": "Odontology", "year": 2026, "date": "09-08", "pmid": "42709312", "tags": ["牙体牙髓", "大语言模型"], "note": "46道ECR验证题×3账号×连续7天，评测4个基础配置(ChatGPT-5/Gemini/Claude/Mistral)+2个RAG配置(NotebookLM/Perplexity Pro)：总体准确率90.8%，模型配置影响显著(p=0.050)——NotebookLM与Gemini错误率最低(3.0%/4.0%)、Claude最高(12.0%)；跨账号(p=0.654)与跨时间(p=0.875)无漂移；临床域影响显著，分类题错误率最高(37.0%)——支持LLM谨慎进入牙体牙髓教学与临床并保留人工监督，但仅限标准化问题，不能外推为综合临床决策能力。"}, {"g": "B", "title": "大语言模型解读口内扫描仪科研文献：ChatGPT-5.2 与 Gemini-3.0 Flash 随提示复杂度表现分化", "src": "The Journal of Prosthetic Dentistry", "year": 2026, "date": "09-08", "pmid": "42711193", "tags": ["数字化", "大语言模型", "器械/设备"], "note": "以PubMed 20篇口扫文献、4级提示复杂度评测2款LLM，2名资深修复专科医师盲评4个维度：简单提示(C1/C2)下ChatGPT-5.2在相关性、清晰度更高(P<.05)，高结构化提示(C3/C4)下Gemini-3.0显著更好(P<.001)；科学准确性上ChatGPT在C1(P=.003)/C4(P=.023)更高，贴近原文Gemini在C2/C4更优——LLM用于口扫等专业文献解读时，模型选择与提示设计深度直接相关，结构化直接问答宜用Gemini类模型。"}, {"g": "B", "title": "自动三维正颌手术规划原型系统：20 例双颌手术初步回顾性研究", "src": "International Journal of Oral and Maxillofacial Surgery", "year": 2026, "date": "09-08", "pmid": "42711161", "tags": ["颌面外科", "数字化", "AI/算法", "器械/设备"], "note": "将头影测量法则、照片分析与临床专家知识嵌入算法框架，由人工标志点自动生成正颌手术规划建议；20例双颌手术（性别与骨性分类均衡）与专家金标准虚拟规划比对（Bland-Altman+ICC）：多数自由度一致性良好，仅Pitch维度显著差异（专家0.88°±4.46 vs 系统5.72°±5.7，P=.0049，CI 1.56–8.12），另按骨性II/III类做亚组分析——原型能产出临床合理方案，加入更多头影测量与算法优化有望提升性能，属自动化正颌规划的早期探索。"}, {"g": "C", "title": "角色差异化 AI 能力框架与课程启示：面向健康专业（含口腔）的用户/开发者/领导者三类角色", "src": "JMIR Medical Education", "year": 2026, "date": "09-08", "pmid": "42710030", "tags": ["AI/算法"], "note": "质性研究：访谈13名医学/口腔学术、临床与医疗AI产业专家（4渠道招募），反思性主题分析归纳分层能力框架——用户角色需机器学习与数据素养以识别算法失效点与数据偏倚、能选型并设定人机分工阈值、保持临床问责与患者安全；开发者/领导者另有差异化要求；为医学与口腔课程按未来角色设计AI素养教育提供框架依据。"}, {"g": "N", "title": "Trust AI × VELMENI 原生集成：FDA 获批影像 AI 直接驱动理赔自动组装（Isaac PracticeOS）", "src": "行业速递 · 产品", "year": 2026, "date": "09-08", "tags": ["器械/设备", "AI/算法", "产品"], "note": "9月8日 Trust AI 宣布将 VELMENI 已获 FDA 510(k) 的 2D（咬翼/根尖/全景）与 3D CBCT 影像 AI 原生嵌入 Isaac PracticeOS 的 RCM Hub：牙医确认 AI 发现后，agent swarm 按各支付方要求自动选取影像证据、匹配编码与叙述语言并组装理赔文档，发出前再由执业牙医与计费专员复核——把『读片诊断→证据化理赔』的缺口补上，是牙科影像 AI 商业化从诊断向支付闭环延伸的信号。"}, {"g": "N", "title": "中国 9 家牙科上市企业 2026 中报：AI 进入口扫/CBCT/正畸产品线，数字化齿科闭环成形", "src": "行业速递 · 产业", "year": 2026, "date": "09-07", "tags": ["数字化", "器械/设备", "产品", "AI/算法"], "note": "OFweek 9月上旬综述：先临三维披露全球首创 IPG 口内摄影测量技术并搭载于 Elite 平台（单牙位精度 0.0076mm、全口种植扫描 0.005mm、深度 22mm）；美亚光电推『旗舰影擎+普惠启航』双布局 CBCT、发布 3D 显微智能体与自研智能 C 形臂（AI 延伸至骨科导航）；时代天使上半年研发投入 1530 万美元，IRS 智能根骨系统自动识别皮质骨/上颌窦/气道/髁突等；现代牙科数码化个案 62.8 万件（+29.2%）、占总销量 35–43%、毛利率升至 58.1%；爱迪特布局口扫+椅旁修复系统与数字化全口义齿——『数据采集→AI 方案→自动制造』链条在国内上市公司产品线全面落地。"}, {"g": "A", "title": "牙科临床决策支持智能（DSI）：概念框架、挑战与研究进展", "src": "Journal of Prosthodontic Research", "year": 2026, "date": "09-08", "pmid": "42716737", "tags": ["数字化", "AI/算法", "器械/设备", "修复"], "note": "首次提出「决策支持智能（DSI）」概念——把循证临床决策树交给 AI 智能执行。作者指出牙科「操作智能」已趋成熟而 DSI 明显滞后，梳理各口腔专科研究进展，给出初步实现路径与关键技术挑战——为牙科 AI 从「能看」走向「能决策」提供方向性框架。", "purpose": "提出并阐述牙科「决策支持智能（DSI）」的概念框架，将 DSI 定义为循证临床决策树的智能化执行，勾勒初步实现路径、识别关键技术挑战，并梳理各主要口腔专科的研究进展。", "design": "概念/叙述性综述：检索 PubMed、Web of Science 与 IEEE Xplore，构建统一概念框架并论证核心观点。", "result": "认为牙科向「智能牙科」的转变尚未完成——「操作智能」日趋成熟而 DSI 滞后；本文首次系统提出 DSI 概念与初步实现策略，并归纳阻碍其发展的关键技术挑战；有望加速 AI 从研究走向标准化、高效、循证的临床决策工具，在资源不均场景减少工作量与差错。", "limit": "属概念/框架性综述，未提供原始临床验证数据；DSI 的落地路径、评价指标与临床获益仍需前瞻性研究与实证检验。"}, {"g": "A", "title": "牙科教育智能技术二十年演进：从虚拟仿真到生成式 AI（文献计量）", "src": "Journal of Dentistry", "year": 2026, "date": "09-09", "pmid": "42716176", "tags": ["数字化", "大语言模型", "AI/算法"], "note": "文献计量描绘 2006–2026 牙科教育智能技术轨迹：1374 篇经萌芽（2006–13）/增长（2014–20）/加速（2021–26，2025 峰值 348 篇）三阶段；美国居首（267 篇，19.4%）、中国第二（181 篇，13.2%）；2025 年中收入经济体发文量首次超过高收入国家（52% vs 40%）；7 个平均发表年 ≥2025 的关键词中 6 个与 AI/LLM 相关——领域已从硬件仿真决定性转向软件驱动的 AI/生成式 AI。", "purpose": "描绘牙科教育中智能技术（从 VR/触觉仿真到 AI 与大语言模型）二十年的发展轨迹与研究前沿。", "design": "文献计量研究：Web of Science 与 Scopus 布尔检索（2006–2026.6），去重后纳入 1374 篇，用 VOSviewer 与 R 从发表趋势、国家/机构合作、期刊评价、共被引聚类、关键词共现与主题演化 6 个维度分析。", "result": "三阶段增长（2025 年峰值 348 篇）；美国第一（19.4%）、中国第二（13.2%）；2025 年中收入经济体发文量首次超过高收入国家（52% vs 40%）；共被引分析显示由 VR 验证（2001–11）→当代综述（2015–22）→AI/LLM（2020–23）演进；7 个平均发表年 ≥2025 的关键词中 6 个涉及 AI/LLM；140 个关键词环形网络中 AI/VR/数字技术成为连接牙科教育与临床的枢纽。", "limit": "文献计量仅反映发表趋势与引用结构，不等同于研究质量或临床价值；依赖 WoS/Scopus 收录与检索式，存在覆盖偏倚与引用滞后。"}, {"g": "B", "title": "机器学习预测上颌第一/第二磨牙 MB2 根管：CBCT 研究", "src": "PLoS One", "year": 2026, "date": "09-08", "pmid": "42715245", "tags": ["牙体牙髓", "影像", "AI/算法", "器械/设备"], "note": "144 例 CBCT（63 女/81 男，伊拉克亚人群）：MB2 根管患病率上颌第一磨牙 65.24%、第二磨牙 36.89%（仅第二磨牙女性显著更高，P<0.001）；以年龄、性别、侧别、MB-DB-P 三角面积/半周长与各孔间距为特征，逻辑回归最优（AUC 0.88/0.90）；随机森林与决策树特征重要性提示 MB-P 距离为最强预测因子——机器学习辅助 CBCT 预测额外根管，助力根管治疗术前评估。"}, {"g": "B", "title": "深度学习筛查口腔鳞癌颈淋巴结转移：显微图像概念验证", "src": "Journal of Microscopy", "year": 2026, "date": "09-09", "pmid": "42714941", "tags": ["颌面外科", "影像", "深度学习", "器械/设备"], "note": "77 例口腔鳞癌淋巴结切片（40 转移/37 非转移）的常规显微图像（×400）：以 16,426/14,192 张 256×256 图块迁移学习训练 5 个模型，微调 Xception 最佳；自研框架与工具 META_DETECT-AI 在整图级取得 99.85% 灵敏度、97.94% 特异度、98.98% 准确率（结节级 100% 灵敏度/71.43% 特异度），并可生成可解释热图——面向资源受限地区、无需全片扫描仪的低成本病理筛查决策支持概念验证。"}, {"g": "B", "title": "大语言模型医学报告生成的有效性、安全性与工作流负担：系统综述", "src": "Journal of Medical Internet Research", "year": 2026, "date": "09-09", "pmid": "42715525", "tags": ["影像", "大语言模型", "器械/设备"], "note": "系统检索 PubMed/MEDLINE、Embase、WoS、Scopus、Cochrane（2016-01-01–2026-05-15），纳入 101 项 LLM/多模态 LLM/视觉-语言基础模型用于影像报告生成的研究：胸部 X 线最多（36 项），其后为 CT、MRI、超声、内镜、病理、眼科、心电、口腔与混合模态；无低偏倚风险研究（15 中等、72 高、14 严重）；安全性（临床显著/漏报/误报错误）与工作流负担（报告时间、修改量、编辑负担）报告稀疏且不一致——临床就绪度仍不确定。"}, {"g": "B", "title": "生成式 AI 在牙科教育中的学术诚信：以教师为中心的落地路径", "src": "Australian Dental Journal", "year": 2026, "date": "09-09", "pmid": "42712190", "tags": ["大语言模型", "数字化", "监管"], "note": "叙述性综述（澳洲语境）：生成式 AI 给牙科教育带来机遇与学术诚信/考核效度挑战，而师资视角最关键却最被忽视；指出传统考核对 AI 辅助高度脆弱，应重设计为评估「AI 难以或无法复制的真实临床胜任力」；强调师资 AI 素养培 const state = {grades:new Set(), tags:new Set(), year:"all", query:"", page:1, sort:"default"};
const PER_PAGE = 20;
let tagExpanded = false;

function esc(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}
function uniqueTags(){const s=new Set();PAPERS.forEach(p=>p.tags.forEach(t=>s.add(t)));return [...s];}

function renderTagChips(){
  const row=document.getElementById("tagRow");row.innerHTML="";
  const chips = uniqueTags().map(t=>{
    const c=document.createElement("span");
    c.className="chip tag-chip"+(state.tags.has(t)?" on":"");
    c.textContent=t;
    c.onclick=()=>{state.tags.has(t)?state.tags.delete(t):state.tags.add(t);state.page=1;renderTagChips();renderList();};
    row.appendChild(c);
    return c;
  });
  // 关键词太多，默认折叠到两行，其余用"展开"收起
  const tops = [...new Set(chips.map(c=>c.offsetTop))].sort((a,b)=>a-b);
  const collapsible = tops.length > 2;
  const secondTop = collapsible ? tops[1] : null;
  chips.forEach(c=>{ if(collapsible && c.offsetTop > secondTop) c.dataset.hidden="1"; });
  if(collapsible){
    const btn = document.createElement("span");
    btn.className = "chip tag-chip expand-btn";
    const apply = ()=>{
      chips.forEach(c=>{ if(c.dataset.hidden==="1") c.style.display = tagExpanded ? "" : "none"; });
      btn.textContent = tagExpanded ? "收起 ▴" : "展开 ▾";
    };
    btn.onclick = ()=>{ tagExpanded = !tagExpanded; apply(); };
    row.appendChild(btn);
    apply();
  }
}

function matches(p){
  if(state.grades.size && !state.grades.has(p.g)) return false;
  if(state.year!=="all" && String(p.year)!==state.year) return false;
  if(state.tags.size && ![...state.tags].every(t=>p.tags.includes(t))) return false;
  if(state.query){const q=state.query.toLowerCase();if(!(p.title.toLowerCase().includes(q)||p.src.toLowerCase().includes(q))) return false;}
  return true;
}

function sortItems(items){
  const arr = items.slice();
  if(state.sort === "time"){
    // 最新优先：按完整日期（年份+月日）降序
    return arr.sort((a,b)=>(b.year+"-"+b.date).localeCompare(a.year+"-"+a.date));
  }
  return arr.sort((a,b)=>{
    const aN=a.g==="N", bN=b.g==="N";
    if(aN && bN) return (b.year+"-"+b.date).localeCompare(a.year+"-"+a.date);
    if(aN !== bN) return aN ? -1 : 1;
    return b.year-a.year || "SABC".indexOf(a.g)-"SABC".indexOf(b.g);
  });
}

function paperHTML(p){
  let meta = esc(p.src) + " · " + p.year + "-" + esc(p.date);
  if(p.g!=="N"){
    const isPMC = String(p.src).indexOf("PMC")>=0;
    const link = isPMC ? "https://pmc.ncbi.nlm.nih.gov/articles/PMC"+p.pmid+"/" : "https://pubmed.ncbi.nlm.nih.gov/"+p.pmid+"/";
    meta += ' · <a href="'+link+'" target="_blank">'+esc(String(p.pmid))+'</a>';
  }
  const tags = p.tags.map(t=>'<span class="tag">'+esc(t)+'</span>').join("");
  let detail="", toggle="";
  if(p.purpose){
    detail = '<div class="detail" style="display:none">'
      + '<div class="f"><b>研究目的</b>：'+esc(p.purpose)+'</div>'
      + '<div class="f"><b>研究设计 + 样本</b>：'+esc(p.design)+'</div>'
      + '<div class="f"><b>核心结果</b>：'+esc(p.result)+'</div>'
      + '<div class="f limit"><b>局限</b>：'+esc(p.limit)+'</div></div>';
    toggle = '<span class="toggle">▸ 详情</span>';
  }
  return '<div class="paper">'
    + '<div class="head"><span class="g '+p.g+'">'+p.g+'</span><h3>'+esc(p.title)+'</h3></div>'
    + '<div class="meta">'+meta+'</div>'
    + '<div class="tags">'+tags+'</div>'
    + '<div class="note">'+esc(p.note)+'</div>'
    + detail + toggle
    + '</div>';
}

function renderList(){
  const filtered = sortItems(PAPERS.filter(matches));
  const totalPages = Math.max(1, Math.ceil(filtered.length/PER_PAGE));
  if(state.page > totalPages) state.page = totalPages;
  if(state.page < 1) state.page = 1;
  const start = (state.page-1)*PER_PAGE;
  const pageItems = filtered.slice(start, start+PER_PAGE);
  document.getElementById("count").textContent = filtered.length;
  const list = document.getElementById("list");
  list.innerHTML = pageItems.length ? pageItems.map(paperHTML).join("") : '<div class="empty">没有符合条件的文献，试试重置筛选 🌿</div>';
  document.getElementById("pageInfo").textContent = state.page + " / " + totalPages + " 页";
  document.getElementById("prevPage").disabled = state.page <= 1;
  document.getElementById("nextPage").disabled = state.page >= totalPages;
}

function bind(){
  document.querySelectorAll("[data-g]").forEach(ch=>{
    ch.onclick=()=>{
      const g=ch.dataset.g;
      state.grades.has(g) ? state.grades.delete(g) : state.grades.add(g);
      ch.classList.toggle("on", state.grades.has(g));
      state.page=1; renderList();
    };
  });
  document.getElementById("yearSel").onchange=e=>{state.year=e.target.value;state.page=1;renderList();};
  document.querySelectorAll(".sort-chip").forEach(ch=>{
    ch.onclick=()=>{
      state.sort = ch.dataset.sort;
      document.querySelectorAll(".sort-chip").forEach(c=>c.classList.toggle("on", c.dataset.sort===state.sort));
      state.page=1; renderList();
    };
  });
  document.getElementById("searchBox").oninput=e=>{state.query=e.target.value.trim();state.page=1;renderList();};
  document.getElementById("prevPage").onclick=()=>{state.page--;renderList();};
  document.getElementById("nextPage").onclick=()=>{state.page++;renderList();};
  document.getElementById("resetAll").onclick=()=>{
    state.grades.clear();state.tags.clear();state.year="all";state.query="";state.page=1;state.sort="default";tagExpanded=false;
    document.querySelectorAll("[data-g]").forEach(c=>c.classList.remove("on"));
    document.querySelectorAll(".sort-chip").forEach(c=>c.classList.toggle("on", c.dataset.sort==="default"));
    document.getElementById("yearSel").value="all";
    document.getElementById("searchBox").value="";
    renderTagChips();renderList();
  };
  document.getElementById("list").addEventListener("click",e=>{
    const t=e.target.closest(".toggle");
    if(!t) return;
    const paper=t.closest(".paper");
    const detail=paper.querySelector(".detail");
    if(!detail) return;
    const open=detail.style.display==="block";
    detail.style.display=open?"none":"block";
    t.textContent=open?"▸ 详情":"▾ 收起";
  });
}

renderTagChips();bind();renderList();
</script>
<script>
if('serviceWorker' in navigator){
  window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js'));
}
</script>
