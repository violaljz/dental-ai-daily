<html lang="zh-CN">
<head>
<meta charset="UTF-8">

<style>
  :root{
    --bg:#f4f6fb;
    --bg-soft:#eef1f8;
    --card:#ffffff;
    --border:#e3e8f2;
    --text:#1b2433;
    --text-2:#5a6678;
    --text-3:#93a0b4;
    --mint:#34d399;
    --teal:#4f6ef7;
    --sky:#60a5fa;
    --pink:#f472b6;
    --lav:#a78bfa;
    --sand:#94a3b8;
    --mono:'JetBrains Mono',ui-monospace,Menlo,monospace;
    --sans:'Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
    --shadow:0 2px 10px rgba(40,60,120,.05),0 8px 30px rgba(40,60,120,.07);
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  body{background:var(--bg);color:var(--text);font-family:var(--sans);font-size:15px;line-height:1.6;-webkit-font-smoothing:antialiased;}

  header.hero{background:linear-gradient(120deg,#e0e9ff,#dcf3ff 55%,#e9e4ff);padding:46px 0 60px;position:relative;overflow:hidden;}
  header.hero::before{content:"";position:absolute;inset:0;background-image:linear-gradient(rgba(79,110,247,.05) 1px,transparent 1px),linear-gradient(90deg,rgba(79,110,247,.05) 1px,transparent 1px);background-size:32px 32px;}
  header.hero::after{content:"";position:absolute;right:-80px;top:-80px;width:280px;height:280px;border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,.55),transparent 70%);}
  .wrap{max-width:1040px;margin:0 auto;padding:0 24px;position:relative;z-index:1;}
  .kicker{font-family:var(--mono);font-size:12px;letter-spacing:2px;color:var(--teal);font-weight:700;text-transform:uppercase;}
  h1{font-size:30px;font-weight:800;margin-top:6px;letter-spacing:-.5px;}
  h1 .hl{background:linear-gradient(90deg,#4f6ef7,#22d3ee);-webkit-background-clip:text;background-clip:text;color:transparent;}
  .sub{color:var(--text-2);margin-top:6px;font-size:15px;}

  /* filter panel */
  .filter-panel{background:var(--card);border:1px solid var(--border);border-radius:18px;padding:18px 20px;margin-top:-34px;box-shadow:var(--shadow);}
  .fp-row{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px;}
  .fp-row:last-child{margin-bottom:0;}
  .fp-label{font-family:var(--mono);font-size:12px;color:var(--text-3);font-weight:700;letter-spacing:.5px;min-width:52px;}

  .chip{cursor:pointer;border:1.5px solid var(--border);background:#fff;color:var(--text-2);border-radius:999px;padding:5px 14px;font-size:13px;font-weight:500;transition:all .15s;user-select:none;}
  .chip:hover{border-color:var(--teal);color:var(--teal);}
  .chip.on{color:#fff;border-color:transparent;font-weight:600;}
  .chip.g-S.on{background:var(--pink);}
  .chip.g-A.on{background:var(--sky);}
  .chip.g-B.on{background:var(--mint);color:#0b3d2c;}
  .chip.g-C.on{background:var(--lav);}
  .chip.g-N.on{background:var(--sand);color:#4a453d;border-color:transparent;}

  .chip.tag-chip{font-size:12.5px;}
  .chip.tag-chip.on{background:var(--teal);border-color:var(--teal);color:#fff;}
  .chip.tag-chip.expand-btn{color:var(--teal);border-style:dashed;background:transparent;font-weight:600;}
  .chip.sort-chip{font-family:var(--mono);font-size:12px;letter-spacing:.5px;}
  .chip.sort-chip.on{background:var(--teal);border-color:var(--teal);color:#fff;}

  select{font-family:var(--sans);font-size:13px;color:var(--text-2);border:1.5px solid var(--border);border-radius:10px;padding:6px 12px;background:#fff;outline:none;cursor:pointer;}
  select:focus{border-color:var(--teal);}
  input[type=search]{font-family:var(--sans);font-size:13px;color:var(--text);border:1.5px solid var(--border);border-radius:10px;padding:7px 14px;background:#fff;outline:none;width:220px;}
  input[type=search]:focus{border-color:var(--teal);}
  .reset{cursor:pointer;font-family:var(--mono);font-size:12px;color:var(--teal);text-decoration:underline;padding:4px 6px;}

  .result-bar{display:flex;align-items:baseline;gap:10px;margin:26px 0 14px;}
  .result-bar .cnt{font-weight:700;font-size:15px;}
  .result-bar .cnt b{font-family:var(--mono);color:var(--teal);font-size:18px;}
  .result-bar .hint{font-size:12.5px;color:var(--text-3);}

  /* paper cards */
  #list{display:flex;flex-direction:column;gap:12px;padding-bottom:60px;}
  .paper{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:16px 20px;box-shadow:0 1px 4px rgba(20,60,50,.04);transition:box-shadow .2s,transform .2s;}
  .paper:hover{box-shadow:var(--shadow);transform:translateY(-1px);}
  .paper .head{display:flex;align-items:flex-start;gap:12px;flex-wrap:wrap;}
  .g{font-family:var(--mono);font-weight:700;font-size:12px;border-radius:8px;padding:3px 9px;color:#fff;letter-spacing:1px;flex-shrink:0;}
  .g.S{background:var(--pink);} .g.A{background:var(--sky);} .g.B{background:var(--mint);color:#0b3d2c;} .g.C{background:var(--lav);} .g.N{background:var(--sand);color:#4a453d;}
  .paper h3{font-size:16px;font-weight:700;line-height:1.4;letter-spacing:-.2px;flex:1;min-width:200px;}
  .paper .meta{font-family:var(--mono);font-size:11.5px;color:var(--text-3);margin-top:4px;}
  .paper .meta a{color:var(--teal);text-decoration:none;}
  .paper .meta a:hover{text-decoration:underline;}
  .paper .tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px;}
  .paper .tag{font-size:11.5px;color:var(--text-2);background:var(--bg-soft);border-radius:999px;padding:2px 10px;}
  .paper .note{margin-top:10px;font-size:13.5px;color:var(--text-2);background:var(--bg-soft);border-radius:10px;padding:10px 14px;}
  .paper .note b{color:var(--text);}
  .paper .detail{margin-top:10px;display:none;border-top:1px dashed var(--border);padding-top:10px;}
  .paper .detail .f{font-size:13.5px;color:var(--text-2);margin-bottom:6px;}
  .paper .detail .f b{color:var(--text);font-weight:600;}
  .paper .detail .f.limit b{color:#c2410c;}
  .toggle{cursor:pointer;font-family:var(--mono);font-size:11.5px;color:var(--teal);margin-top:10px;display:inline-block;user-select:none;}
  .toggle:hover{text-decoration:underline;}
  .empty{text-align:center;color:var(--text-3);padding:50px 0;font-size:14px;}
  .pagination{display:flex;align-items:center;justify-content:center;gap:14px;padding:8px 0 60px;}
  .pg-btn{cursor:pointer;font-family:var(--mono);font-size:13px;color:var(--text-2);border:1.5px solid var(--border);border-radius:10px;padding:6px 16px;background:#fff;transition:all .15s;}
  .pg-btn:hover:not(:disabled){border-color:var(--teal);color:var(--teal);}
  .pg-btn:disabled{opacity:.4;cursor:not-allowed;}
  .pg-info{font-family:var(--mono);font-size:13px;color:var(--text-3);}

  footer{padding:30px 0 50px;text-align:center;color:var(--text-3);font-size:12.5px;}
  footer .mono{font-family:var(--mono);}

  @media(max-width:640px){ h1{font-size:24px;} input[type=search]{width:100%;} .fp-row{gap:8px;} }
</style>
</head>
<body>

<header class="hero">
  <div class="wrap">
    <div class="kicker">Dental × AI Literature Library</div>
    <h1>口腔 × AI <span class="hl">文献库</span></h1>
    <div class="sub">每日精选 · 按等级 / 关键词 / 年份 / 关键词筛选</div>
  </div>
</header>

<div class="wrap">
  <div class="filter-panel">
    <div class="fp-row">
      <span class="fp-label">等级</span>
      <span class="chip g-S" data-g="S">S</span>
      <span class="chip g-A" data-g="A">A</span>
      <span class="chip g-B" data-g="B">B</span>
      <span class="chip g-C" data-g="C">C</span>
      <span class="chip g-N" data-g="N">N</span>
      <span class="reset" id="resetAll">重置全部</span>
    </div>
    <div class="fp-row">
      <span class="fp-label">年份</span>
      <select id="yearSel">
        <option value="all">全部年份</option>
        <option>2026</option>
        <option>2025</option>
        <option>2024</option>
      </select>
      <span class="fp-label" style="margin-left:14px;">搜索</span>
      <input type="search" id="searchBox" placeholder="搜索标题 / 出处…">
    </div>
    <div class="fp-row">
      <span class="fp-label">关键词</span>
      <span id="tagRow" style="display:flex;gap:6px;flex-wrap:wrap;"></span>
    </div>
  </div>

  <div class="result-bar">
    <span class="cnt">共 <b id="count">0</b> 篇</span>
    <span class="hint">点击卡片下方「详情」查看目的 / 设计 / 结果 / 局限</span>
    <span class="sort-row" style="margin-left:auto;display:flex;gap:6px;">
      <span class="chip sort-chip on" data-sort="default">默认排序</span>
      <span class="chip sort-chip" data-sort="time">最新优先</span>
    </span>
  </div>

  <div id="list"></div>
  <div class="pagination">
    <button class="pg-btn" id="prevPage">‹ 上一页</button>
    <span class="pg-info" id="pageInfo">1 / 1 页</span>
    <button class="pg-btn" id="nextPage">下一页 ›</button>
  </div>
</div>

<footer>
  <div class="wrap">
    <div class="mono">DENTAL × AI LITERATURE · DATA FROM PUBMED / PMC / MEDRXIV</div>
  </div>
</footer>

<script>
const PAPERS = [{"g":"S","title":"AI 能否匹敌人类专家的牙周长期预后？一项对比准确性研究","src":"J Clin Periodontol","year":2026,"date":"08-21","pmid":"42629146","tags":["牙周","AI/算法","临床预测"],"note":"AI vs 12牙周专家+11全科牙医，预测300颗牙10年丧失风险。固定阈值下医生更准，最优阈值下AI相当。","purpose":"比较 AI 模型与资深临床医生预测牙齿 10 年丧失风险的预后表现。","design":"AI 模型 vs 12 名牙周专科医生 + 11 名全科牙医，对 300 颗已知结局牙齿独立评分（0–10）。","result":"固定阈值医生更准（75.6% / 74.9% vs AI 69.2%）；最优阈值下 AI 全因丧失准确率最高（67.5%）。","limit":"AI 校准明显差于医生（Brier 0.247 vs 0.171），整体预测能力中等。"},{"g":"S","title":"口腔-肠道菌群转移签名：胃肠癌的无创诊断新框架","src":"Cell Host & Microbe","year":2026,"date":"08-20","pmid":"42624114","tags":["口腔微生物","AI/算法","肿瘤诊断"],"note":"507人配对口腔/粪便菌群，随机森林分类器，7队列验证；仅用口腔菌群即可区分胃/结直肠癌。","purpose":"利用口腔→粪便菌群转移（MF 指数）建立胃肠癌无创诊断与风险分层。","design":"507 人（健康+代谢病+胃肠癌）配对菌群，随机森林分类器，7 个独立队列验证。","result":"MF 模型灵敏度显著高于粪便潜血试验，仅用口腔菌群数据即可区分胃/结直肠癌。","limit":"横断面设计为主，需前瞻性队列验证因果与泛化。"},{"g":"A","title":"AI 多学科牙科治疗规划：四种大模型的对比评估","src":"J Prosthodontics","year":2026,"date":"08-21","pmid":"42629964","tags":["修复","数字化","大语言模型"],"note":"对比 ChatGPT-5/Copilot/Gemini/OpenEvidence 生成治疗规划，OpenEvidence 与 ChatGPT-5 最优。","purpose":"对比四种大模型生成牙科综合治疗规划的能力。","design":"10 个临床案例（口内照+根尖片），4 位专家共识为金标准，5 维度评分。","result":"OpenEvidence（7.7）与 ChatGPT-5（7.6）最高；Copilot（4.7）且 3/10 案例未生成。","limit":"所有系统均有临床显著错误，仅宜作辅助决策。"},{"g":"A","title":"全景片放射组学 + 机器学习：区分糖尿病下颌骨改变","src":"Dentomaxillofacial Radiology","year":2026,"date":"08-21","pmid":"42627344","tags":["影像","放射组学","AI/算法"],"note":"225张全景片、107个放射组学特征，逻辑回归最优（AUC 0.958）。","purpose":"用放射组学+ML 区分 T1DM/T2DM 与健康人的下颌骨改变。","design":"225 张全景片（各75例），107 个特征，4 种 ML 算法，泄漏无关管线。","result":"逻辑回归最优（左下颌体部 AUC 0.958，准确率 0.833），T2DM 判别 AUC 1.000。","limit":"单中心回顾性，需外部验证。"},{"g":"A","title":"CBCT 三维头颅测量标志点自动标注的两阶段框架","src":"Journal of Dentistry","year":2026,"date":"08-20","pmid":"42624243","tags":["正畸","影像","AI/算法"],"note":"144个CBCT，两阶段框架，平均径向误差1.01mm，对不完整视野稳健。","purpose":"开发不完整观测感知的框架，自动定位 CBCT 三维头颅测量标志点。","design":"144 个 CBCT（90全标注+54部分标注），115训练/29测试，两阶段粗到精。","result":"MRE 1.01mm，2mm内检出率>91%，6mm内达100%。 亿美元研发投入，加码 AI 一体化云端牙科软件","src":"行业速递 · 资本","year":2026,"date":"08-20","tags":["资本","融资","产品"],"note":"AI 驱动的一体化云端牙科软件公司 Curve Dental 宣布向 Curve Hero 平台追加 2 亿美元研发投入；称北美约 85% 牙科诊所（约 16 万家）仍用老旧客户端-服务器系统，市场整合在即。"},{"g":"N","title":"比利时牙科 AI 公司 Relu 获 DIA 175 万美元战略投资","src":"行业速递 · 资本","year":2026,"date":"08-04","tags":["资本","融资","产品"],"note":"Relu（Relu® Automate，自动化技工厂牙科设计与行政流程）获 Dental Innovation Alliance 175 万美元战略投资，加速美国扩张；平台年处理来自 82 国技工厂的 100 万+ 病例。"},{"g":"A","title":"云端 AI 软件前牙自动分割的多中心 CBCT 外部验证","src":"Journal of Dentistry","year":2026,"date":"08-24","pmid":"42637207","tags":["影像","数字化","深度学习","产品"],"note":"190 例 CBCT、5 种设备、879 颗牙，云端 AI（Relu）自动分割 90.1% 达标；IoU 0.92–0.95、DSC 0.96–0.97。牙髓治疗、正畸托槽、邻近高密度伪影显著增加人工修正需求。","purpose":"外部验证云端 AI 前牙自动分割软件的跨设备泛化能力，并识别需要人工修正的因素。","design":"190 例 CBCT（5 种系统）、879 颗牙分割图；双评分者评估自动 vs 修正分割的体素/表面/时间效率指标；混合效应 logistic 回归分析修正需求相关因素（α=5%）。","result":"90.1% 自动分割达标；跨设备 IoU 0.92–0.95、DSC 0.96–0.97、召回 0.94–0.95、MAD<0.07mm、RMSE<0.10mm；牙髓治疗(OR 4.43)、正畸托槽(OR 3.74)、邻近高密度伪影(OR 7.88)显著增加修正需求；自动分割显著快于人工。","limit":"仅覆盖前牙，且由单一云端软件（Relu）评估；结论需在其他商业软件与更多中心进一步验证。"},{"g":"A","title":"EffiSegNet：光化性唇炎与唇鳞癌临床照片的自动分割","src":"Journal of Oral Pathology & Medicine","year":2026,"date":"08-23","pmid":"42634274","tags":["深度学习","影像","颌面外科"],"note":"EfficientNet-B0 + Ghost Module，489 张训练/内部测试 + 82 张两家机构外部验证；DSC 内部 0.888 / 外部 0.875，跨机构无性能下降，对溃疡/结痂/角化稳健。","purpose":"开发并外部验证唇部潜在恶性病变（光化性唇炎）与唇鳞癌临床照片的深度学习分割模型。","design":"EffiSegNet-B0（ImageNet 预训练 EfficientNet-B0 编码器 + Ghost Module 聚合多阶段特征）；489 张单中心照片训练/内部测试，82 张来自 UFPB、UFMG 两家独立机构外部验证。","result":"内外部准确率均 >95%；DSC 内部 0.888（95%CI 0.871–0.904）、外部 0.875（0.862–0.888），IoU 0.802 / 0.782；外部验证无性能下降，对溃疡、结痂、角化等病变变异稳健。","limit":"概念验证研究，样本来自有限机构；需前瞻性多中心、更大样本确认真实临床可用性。"},{"g":"B","title":"大语言模型 AI 提升口腔医学生沟通技能的作用","src":"European Journal of Dental Education","year":2026,"date":"08-23","pmid":"42634266","tags":["大语言模型","数字化"],"note":"伦敦国王学院项目，用 LLM+RAG 模拟牙科情景训练医患沟通（2 文本 + 1 语音平台），试点反馈积极，拟对比传统演员教学。","purpose":"探索大语言模型在培养本科口腔医学生医患沟通（行为改变）技能中的作用。","design":"KCL 牙学院 × 信息系合作；3 代生成式 AI（2 文本 + 1 语音），构建 Q&A 数据集 + 医学信息库 RAG + LangChain 提示工程；志愿者临床人员与学生试点。","result":"试点反馈积极，AI 平台可有效支持沟通技能培养；拟于 2024-25 学年面向二年级牙科/牙科卫生学生推广，并与传统演员教学随机对比。","limit":"主要报告试点阶段，尚未完成与传统教学的随机对比；学习成效与满意度定量证据待发表。"},{"g":"N","title":"Overjet IRIS 获 FDA 批准：首个牙科影像质量实时 AI 检查系统","src":"行业速递 · 审批","year":2026,"date":"08-04","tags":["审批","产品"],"note":"Overjet 获第二项 FDA 批准，IRIS 成为首个获 FDA 批准的牙科影像质量 AI 系统，可在患者离椅前实时捕捉 X 光质量问题；与 Vision AI 诊断结合，覆盖整个就诊流程。"},{"g":"B","title":"机器人辅助计算机种植手术：系统架构、临床精度与新兴技术综合评述","src":"Journal of Robotic Surgery","year":2026,"date":"08-25","pmid":"42640525","tags":["种植","机器人","数字化","器械/设备"],"note":"r-CAIS 结构化综述：梳理系统架构/分类/临床流程，对比静态与动态计算机辅助手术，分析影响种植精度的患者/医生/系统因素及优化策略；定性证据综合（无荟萃分析）。"},{"g":"B","title":"堆叠集成深度学习：根尖片根尖周病变检测与大小分层","src":"Australian Endodontic Journal","year":2026,"date":"08-24","pmid":"42638331","tags":["深度学习","影像","牙体牙髓"],"note":"146 张根尖片、5 种 CNN 骨架堆叠集成（MLR/XGBoost 元学习器），内测准确率 0.96、AUC 1.00，<2mm 病变灵敏度 0.94；单中心小样本，作者自评结果偏乐观。"},{"g":"B","title":"唾液液体活检用于口腔与全身疾病检测","src":"Journal of Periodontal Research","year":2026,"date":"08-25","pmid":"42638446","tags":["口腔微生物","数字化","AI/算法"],"note":"唾液液体活检综述，涵盖胞外 RNA/cfDNA/蛋白/代谢/微生物等多组学；AI 驱动的多组学整合、微流控与 POCT 正突破检测灵敏度与疾病分层瓶颈。"},{"g":"C","title":"机器学习预测腓动脉肌间隔穿支（腓骨瓣下颌骨重建）","src":"Journal of Reconstructive Microsurgery","year":2026,"date":"08-25","pmid":"42641646","tags":["颌面外科","临床预测","AI/算法"],"note":"246 例（490 肢）CTA、4900 个肢-区观察；XGBoost AUC 0.710，可中等程度预测穿支存在、再现腓骨中段高发峰，辅助腓骨瓣皮岛设计但无法替代影像定位。"},{"g":"N","title":"ADA 调研：AI 在诊所扎根但止步于治疗决策","src":"行业速递 · 调研","year":2026,"date":"08-17","tags":["政策"],"note":"ADA HPI 对 552 位美国私人执业牙医调研：超 2/5 已用 AI 于至少一项任务、1/4 计划采用，但仅不足 1/20 用 AI 做治疗建议、超 4/5 明确不用；共识转向「AI 辅助、医生主导」。"},{"g":"N","title":"Medicall（DentalCall）AI 电话助手获种子轮融资","src":"行业速递 · 资本","year":2026,"date":"08-14","tags":["资本"],"note":"韩国牙科诊所 AI 电话助手 DentalCall 运营商 Medicall 获种子轮融资（AI Angel Club、CNTTech、TaleVentures、Antler Korea 参投），用于扩大 AI 前台部署、减轻前台人力负担。"},{"g":"A","title":"OSCC 隐匿性颈淋巴结转移的 AI 分割：或减少细胞角蛋白染色需求","src":"Histopathology","year":2026,"date":"08-27","pmid":"42656182","tags":["颌面外科","影像","深度学习"],"note":"两阶段深度学习分割口腔鳞癌颈淋巴结隐匿转移，微调后 precision 0.878/召回 0.861、整体准确率 0.919，或减少 CK 免疫组化工作量。","purpose":"开发两阶段深度学习框架，从常规 H&E 切片分割口腔鳞癌（OSCC）隐匿性颈淋巴结微转移，以减少对细胞角蛋白（CK）免疫组化的依赖。","design":"资深病理医生标注的 OSCC 原发灶 + 颈淋巴结标本数据集；先在原发灶肿瘤形态预训练，再在淋巴结转移灶微调；留出独立测试集，像素级分割指标 + 病例级分析，与 CK 染色定性对比。","result":"预训练阶段 precision 0.8484 / recall 0.8682；微调后提升至 0.8778 / 0.8607，整体准确率 0.9193；AI 预测与 CK 染色在可获取免疫组化病例中一致性良好。","limit":"单中心、样本量有限，标注依赖资深病理医生且 CK 仅临床需要时补充；需前瞻性多中心验证方可评估临床减少 CK 染色的实际可行性与成本效益。"},{"g":"A","title":"深度学习 MRI 咬肌体积与老年人口腔损伤及认知衰弱相关","src":"Experimental Gerontology","year":2026,"date":"08-26","pmid":"42648504","tags":["影像","深度学习","临床预测"],"note":"CNN 分割 T1WI 咬肌，2077 名日本老年人，咬肌体积越大口腔损伤评分越低（OR 0.67）。","purpose":"开发卷积神经网络（CNN）从 T1 加权 MRI 自动分割咬肌，检验咬肌体积这一影像结构表型与老年人口腔损伤及认知衰弱的关联。","design":"人类在环迭代训练的 CNN（基于东北大学医院 T1WI）；应用于日本前瞻性衰老/痴呆协作研究 Hirosaki 队列 3D T1WI，图像质控后最终纳入 2077 名参与者（平均 69.9±4.1 岁）。","result":"咬肌体积越大，复合口腔损伤评分越低（OR 0.67, 95%CI 0.60–0.74, p<0.001）；与结构异常关联最强（OR 0.60），其次牙周炎症（OR 0.81）、口腔功能下降（OR 0.86）；与认知衰弱呈负相关但完全校正后不显著。","limit":"横断面设计无法确立因果；认知衰弱关联校正后不显著；预训练 CNN 已开源（github.com/bthyreau/masseter_mri），需纵向与多中心验证。"},{"g":"B","title":"PAISE：牙体牙髓领域 AI 研究报告规范（PRISMA 式）发布","src":"International Endodontic Journal","year":2026,"date":"08-27","pmid":"42656074","tags":["牙体牙髓","监管"],"note":"国际牙体牙髓病学杂志宣布制定 AI 研究报告规范 PAISE，为该领域首个专门报告指南。"},{"g":"B","title":"全景片根尖孔开闭状态的深度学习检测：YOLO vs Faster R-CNN","src":"Journal of Imaging Informatics in Medicine","year":2026,"date":"08-25","pmid":"42642693","tags":["牙体牙髓","影像","深度学习"],"note":"1498 张儿童全景片，YOLOv8x 检测下颌磨牙根尖开闭状态 mAP@0.5 达 0.956，辅助儿科牙髓治疗决策。"},{"g":"B","title":"白光图像深度学习检测口腔潜在恶性病变与口腔癌：系统综述与 Meta 分析","src":"Clinical Oral Investigations","year":2026,"date":"08-26","pmid":"42645587","tags":["颌面外科","影像","深度学习"],"note":"汇总灵敏度 OPMD 0.81 / 口腔癌 0.836，但特异度极低（0.161 / 0.138），需警惕大量假阳性。"},{"g":"B","title":"大语言模型在口腔癌患者教育中的可靠性与可读性评估","src":"Oral Health & Preventive Dentistry","year":2026,"date":"08-26","pmid":"42644524","tags":["大语言模型","颌面外科"],"note":"4 款 LLM 回答 22 个口腔癌问题，Perplexity Pro 可靠性评分最高（DISCERN 46.36 / EQIP 85），可读性普遍偏高。"},{"g":"C","title":"劈尖钻在皮质骨钻孔中的力/热坏死预测：有限元 + 神经网络建模","src":"Biomedical Physics & Engineering Express","year":2026,"date":"08-26","pmid":"42648309","tags":["种植","AI/算法"],"note":"FEM+ANN 建模手术骨钻孔，劈尖钻 115° 劈角 + 0.25mm 腹板 + 7° 前角，钻力降 46.8%、热坏死降 5.2%。"},{"g":"C","title":"PDDUNet：原始-对偶深度展开网络用于 CT 金属伪影去除","src":"Journal of X-Ray Science and Technology","year":2026,"date":"08-26","pmid":"42647755","tags":["影像","深度学习"],"note":"将数据保真项与正则项双重展开用于 CT 金属伪影去除（种植体等），合成 + 临床数据集优于现有 MAR 方法。"},{"g":"N","title":"Overjet Voice 上线免手硬组织图表与自然语音牙周图表","src":"行业速递 · 产品","year":2026,"date":"08-17","tags":["大语言模型","数字化"],"note":"基于自研实时大语言模型（98% 准确率、50M+ token 训练），覆盖 CareStack/Eaglesoft/Open Dental/Dentrix 等主流 PMS。"},{"g":"N","title":"Pearl 发布首个美国大规模影像口腔健康普查（Oral Health Index）","src":"行业速递 · 数据","year":2026,"date":"08-10","tags":["影像","临床预测"],"note":"用 FDA 获批 AI 分析 2600 万+ 就诊影像，未经治疗龋齿达既往全国估计 4.5 倍，AI 影像走向公共卫生基础设施。"},{"g":"A","title":"AI 聊天机器人与大语言模型用于牙外伤管理决策支持：系统综述与 Meta 分析","src":"Dental Traumatology","year":2026,"date":"08-27","pmid":"42657907","tags":["大语言模型","AI/算法","临床预测"],"note":"28 项研究纳入；探索性 Meta 分析显示准确/指南一致回答合并比例 81.7%，但异质性极高，安全性与引用可靠性存疑。","purpose":"系统评价 AI 聊天机器人与大语言模型在牙外伤（牙脱位、撕脱、乳牙外伤等）管理与决策支持中的准确性、一致性、安全性与指南一致性。","design":"检索 PubMed/Scopus/Embase 至 2026-04，纳入 28 项研究；按五大转化功能（患者/照护者急诊指导、指南基准、领域工作流、多模态真实病例、撕脱预后）叙事综合，并对 9 项二分类结局做探索性 Meta 分析。","result":"准确/指南一致回答的合并比例为 81.7%（异质性极高）；性能随模型、提示格式、参考标准、输入类型与评估方法而异；常见安全隐患包括建议不完整、误导信息、回答不一致、可读性不足、引用不可靠。","limit":"研究间异质性极高、评估方法差异大；多为横断面基准测试，缺乏真实急诊场景的前瞻性验证。"},{"g":"B","title":"AI 模型在 CBCT 上检测牙源性角化囊性瘤的诊断准确性：系统综述与 Meta 分析","src":"Health Science Reports","year":2026,"date":"08-27","pmid":"42657008","tags":["影像","深度学习","颌面外科"],"note":"12 项研究，合并灵敏度 89%（79–95%）、特异度 92%（81–97%）、AUC 0.828；深度学习（91%）灵敏度优于机器学习（86%）。"},{"g":"C","title":"智能纳米传感器与 IoT 系统的实时诊断监测进展","src":"Analytical Methods","year":2026,"date":"08-27","pmid":"42657776","tags":["数字化","AI/算法","口腔微生物","器械/设备"],"note":"综述纳米传感器+AI+IoT 融合框架；电化学免疫传感器 120 秒内以 1.424 fg/mL 检出「口腔癌生物标志物」，石墨烯纳米传感器近 27 pM 检出 CRP。"},{"g":"N","title":"BeCertain 获 170 万英镑种子轮：临床级牙科诊断 AI（KCL/萨里分拆）","src":"行业速递 · 资本","year":2026,"date":"07-16","tags":["融资","资本"],"note":"伦敦国王学院（KCL）与萨里大学分拆公司 BeCertain 获 170 万英镑（约 200 万欧元）pre-seed，AI 风投 SVV（Sure Valley Ventures）领投、Innovate UK 支持；开发不确定度感知 ML，首个用例为 2D 口内 X 光片解读（龋齿/骨吸收/根尖周感染/修复体缺损）。"},{"g":"N","title":"韩国 InnoDtech 获 338 万美元：AI 正畸平台冲刺 FDA 与 CE 审批","src":"行业速递 · 资本","year":2026,"date":"07-23","tags":["融资","审批","正畸","产品"],"note":"AI 正畸平台 Dr.AlignNavi 与隐形矫治 Clara AI 开发商 InnoDtech 完成 KRW 50 亿（约 338 万美元）融资，Albatross、KDB、SK 证券参投；目标 9–10 月获 FDA 批准并推进欧洲 CE MDR。"},{"g":"A","title":"移动 AI 口腔病变分诊用于社区口腔癌筛查：前瞻性现场评估","src":"JMIR mHealth and uHealth","year":2026,"date":"08-26","pmid":"42665557","tags":["影像","AI/算法","临床预测"],"note":"台湾东部602人/4283张口内图前瞻现场评估，红标高危识别灵敏度75%、特异度98.6%、准确率98.5%、AUC 0.957。","purpose":"评估参数锁定、人工监督下的移动 AI 口腔病变分诊系统在社区口腔癌筛查真实场景中的现场表现。","design":"台湾东部前瞻性社区现场评估（2025-06-17 至 12-31），602 名受检者、4283 张可判读白光口内图；非专科人员手持移动设备采集，AI 现场质控 + 红/黄/绿三级风险分诊，3 名口腔颌面外科专家共识作参考标准。","result":"红标高危病变识别灵敏度 75.0%（95%CI 50.5–89.8%）、特异度 98.6%、准确率 98.5%、PPV 17.6%、NPV 99.9%；红/黄/绿分诊 ROC-AUC 0.957/0.931/0.964；专家一致性 Fleiss κ 0.921、Gwet AC1 0.981。","limit":"低患病率现场下 PPV 偏低（17.6%），仅宜作人工监督下的转诊优先级支持；单地区，需多中心盲法评估、参与者结局与纵向随访。"},{"g":"A","title":"大语言模型回答牙髓冲洗剂问题：准确性、幻觉与临床风险的评估","src":"Journal of Endodontics","year":2026,"date":"08-28","pmid":"42665211","tags":["牙体牙髓","大语言模型","AI/算法"],"note":"4 款通用 LLM × 100 题（含矛盾诱导题）双盲评分：Claude/Gemini 最准，DeepSeek 幻觉率 29%、16% 回答具致命风险。","purpose":"评估 4 款通用大语言模型在牙髓冲洗剂（次氯酸钠、EDTA、氯己定等）知识上的准确性、可读性、幻觉亚型与临床风险。","design":"以文献构建参考集，ChatGPT-5.2 / Claude Sonnet 4.5 / Gemini 3 Pro / DeepSeek 3.2 各答 100 题（80 事实 + 20 矛盾诱导），2 名盲态牙体牙髓专家独立评分，10 天后复测稳定性。","result":"Claude Sonnet 4.5 与 Gemini 3 Pro 准确率最高（1.75/1.74）、幻觉率最低（7%/9%）；DeepSeek 3.2 准确率最低（1.08）、幻觉率 29%、16% 回答具致命风险；幻觉与临床风险强相关（ρ=0.93）；Gemini 复测稳定性最高（κ=0.95）。","limit":"仅覆盖冲洗剂主题的体外基准测试，未涉真实临床对话；结论随模型版本迭代可能变化。"},{"g":"B","title":"口腔鳞癌与口腔潜在恶性病变的无创检测：诊断准确性伞形综述","src":"Clinical Oral Investigations","year":2026,"date":"08-28","pmid":"42663684","tags":["影像","AI/算法","临床预测"],"note":"57 篇系统综述的伞形评价（9 种无创技术）：OCT 诊断准确性最高（灵敏度/特异度 0.91，DOR 108.5），联合 AI 后进一步提升。"},{"g":"N","title":"Lupin Dental 完成 1500 万欧元 A 轮：机器人自动化贴面牙体预备","src":"行业速递 · 资本","year":2026,"date":"08-28","tags":["资本","器械/设备"],"note":"法国牙科机器人公司 Lupin（Digicuto SAS，2019 年成立于蒙彼利埃）获私募 Fynveur 领投 1500 万欧元 A 轮（直接注资 1000 万欧元，Bpifrance 提供贷款）。其 Lupin 机器人系统可在牙医监督下自动完成贴面牙体预备；已获印度、英国批准（由 Dolphin Lifesciences 代理销售），尚未获美国/欧盟认证。"},{"g":"B","title":"PET/CT 放射组学预测舌鳞癌颈淋巴结转移","src":"Oral Radiology","year":2026,"date":"08-29","pmid":"42667523","tags":["影像","放射组学","临床预测","颌面外科"],"note":"316例舌鳞癌，临床+107个PET/CT放射组学特征逻辑回归预测颈淋巴结转移，AUC 0.88，优于淋巴结SUVmax(0.76)与专家视觉评估(0.79)，外部验证准确率0.80。"},{"g":"B","title":"大语言模型生成牙体牙髓参考文献的准确性与错误模式","src":"Medical Science Monitor","year":2026,"date":"08-29","pmid":"42665969","tags":["牙体牙髓","大语言模型","AI/算法"],"note":"ChatGPT 5 vs Claude Sonnet 4.6，300条参考文献核验：Claude显著更准(1.79 vs 1.25)，DOI准确率90% vs 35%；提示词特异度影响有限。"},{"g":"C","title":"AI 预测无牙颌患者修复后颜面美学","src":"European Journal of Dentistry","year":2026,"date":"08-29","pmid":"42667931","tags":["修复","AI/算法","产品"],"note":"14例全口义齿，Gemini/FaceApp模拟戴牙后颜面；美学上可比(专家/患者无显著差异)，但缺乏定量准确性。"},{"g":"N","title":"国家药监局发布《牙科学 光固化机》等46项医疗器械行业标准","src":"行业速递 · 标准","year":2026,"date":"08-14","tags":["标准","监管","器械/设备"],"note":"NMPA 2026年第76号公告(8月14日)发布46项口腔医疗器械行业标准，含《牙科学 光固化机》等，规范牙科器械标准化。"},{"g":"N","title":"国产AI医疗器械三类证获批提速，口腔影像AI仍属蓝海","src":"行业速递 · 审批","year":2026,"date":"07-06","tags":["审批","政策","器械/设备"],"note":"截至2026年中NMPA累计127款AI医用软件证(126款三类)，2026上半年新增13款；获批集中在肺结节/心血管/眼底，口腔影像AI获证仍少、属结构蓝海。"},{"g":"A","title":"深度学习 MRI 与病理标志物联合改进舌鳞癌风险分层、指导术后放疗：多中心队列研究","src":"Radiotherapy and Oncology","year":2026,"date":"09-01","pmid":"42456900","tags":["深度学习","影像","颌面外科","临床预测"],"note":"658例训练+419例双中心外部验证；DL-MRI风险评分独立预测OS/DFS，病理深度学习列线图(PDLN) C-index 0.85(OS)/0.76(DFS)；CRIS-OTSCC低危组PORT无生存获益。","purpose":"整合深度学习(DL)MRI分析与病理标志物，构建更精准的口腔舌鳞癌(OTSCC)风险分层系统，指导术后放疗(PORT)决策。","design":"回顾性多中心队列；658例术前MRI开发DL模型，419例来自两个独立中心外部验证；将DL风险评分与病理标志物(pT/pN分期、分级、肿瘤出芽)结合构建PDLN与CRIS-OTSCC系统；C-index与时依ROC评估。","result":"DL模型各队列C-index均>0.700，多因素校正后独立预测OS与DFS(均P<0.001)；PDLN在训练/内部/外部A/外部B队列OS C-index为0.850/0.809/0.804/0.778，DFS为0.763/0.726/0.737/0.736；CRIS-OTSCC低危组PORT不改善OS(HR 0.429, P=0.220)与DFS(HR 0.899, P=0.764)。","limit":"回顾性设计；PORT获益结论基于观察性亚组分析，需前瞻性随机验证。"},{"g":"A","title":"深度学习框架基于全切片图像分类口腔黏膜下纤维化相关口腔鳞癌","src":"Journal of Dentistry","year":2026,"date":"08-31","pmid":"42674155","tags":["深度学习","影像","颌面外科","AI/算法"],"note":"斯里兰卡250例WSI(496万+图像块)训练混合算子MIL模型；内部测试AUC 0.986、AUPRC 0.977；外部20张显微照片19张正确；召回100%/特异度92%。","purpose":"开发轻量级深度学习框架，基于H&E全切片图像(WSI)区分口腔黏膜下纤维化(OSF)及其相关口腔鳞癌(OSF-OSCC)。","design":"回顾性研究；156例OSF与94例OSF-OSCC的WSI，80:20划分；200张WSI提取4,966,521个图像块训练并交叉验证混合算子多实例学习(MIL)模型；50张WSI内部测试+20张外部显微照片；评估区分度、校准与净获益。","result":"内部测试AUC 0.986(95%CI 0.953-1.000)、AUPRC 0.977、Brier 0.034；外部20张中19张分类正确；召回/特异度/精度/平衡准确率/NPV为100%/92%/83.3%/96%/100%；各概率阈值下均有潜在净获益。","limit":"单中心回顾性数据；外部测试仅20张显微照片而非完整WSI；需多中心前瞻验证。"},{"g":"A","title":"引导牙周病学与种植牙医学的AI革命：概念、伦理、问责与可持续采用路线图","src":"Periodontology 2000","year":2026,"date":"08-31","pmid":"42670718","tags":["牙周","种植","AI/算法","监管"],"note":"权威综述(检索至2026年2月)：AI在骨丧失/骨内缺损检测、微生物组分析、种植规划与预后预测等有前景；但单模态单中心数据、外部验证不足、偏倚与可解释性仍是障碍；主张AI定位为临床医生监督下的辅助工具。","purpose":"系统审视牙周病学与种植牙医学中AI的应用现状、伦理与转化挑战，提出负责任、可持续采用的路线图。","design":"叙述性综述；检索PubMed、Embase、Cochrane Library至2026年2月；梳理AI应用场景、局限、负责任的实施方法与可持续采用路线图。","result":"主要应用包括骨丧失检测、骨内缺损检测、生物膜/微生物组分析、患者沟通、术后监测、种植规划、种植体系统识别与预后预测；提升了效率、一致性与可及性，但单模态/单中心/不可共享数据、临床与生物变量整合不足、外部验证缺乏、偏倚/隐私/可解释性担忧构成主要局限。","limit":"叙述性综述，非系统评价；现有证据以回顾性单模态数据为主，缺乏临床泛化性。"},{"g":"B","title":"人工智能与数字印模：利与弊","src":"Australian Dental Journal","year":2026,"date":"08-31","pmid":"42671088","tags":["数字化","器械/设备","AI/算法","修复"],"note":"AI在口扫中提供实时伪影去除、扫描拼接优化与高效三维数据采集；但低置信区间的静默补全/篡改风险值得警惕——推断几何可能看起来解剖学合理却不再是患者的真实记录；呼吁临床医生保持审慎审查。"},{"g":"B","title":"AI用于正畸与牙颌面评估(2D/3D面部图像)的诊断性能：系统综述","src":"International Orthodontics","year":2026,"date":"08-31","pmid":"42673893","tags":["正畸","数字化","影像","AI/算法"],"note":"PROSPERO注册系统综述，纳入14项研究：头影测量预测、骨骼模式分类、下颌畸形诊断、正颌手术需求预测等；分类准确率73.1%-97.7%，AUC 0.768-0.987；仅1项真实外部验证，总体证据级别低，定位为专科评估的辅助而非替代。"},{"g":"B","title":"通用多模态基础模型检测邻面继发龋的局限","src":"Odontology","year":2026,"date":"08-31","pmid":"42671523","tags":["大语言模型","影像","牙体牙髓","AI/算法"],"note":"零样本测试GPT-5o与Gemini 2.5 Flash检测208颗牙邻面继发龋：GPT-5o敏感度64.7%但特异度仅32.3%，Gemini敏感度82.8%但特异度13.0%，kappa≈-0.02(与金标准无一致性)；强假阳性倾向、定位能力差；不支持未经领域训练直接用于继发龋检测。"},{"g":"B","title":"图像深度学习诊断口腔鳞癌的准确性：系统综述与Meta分析","src":"Journal of Evidence-Based Dental Practice","year":2026,"date":"09-01","pmid":"42556899","tags":["深度学习","影像","颌面外科"],"note":"纳入52项研究：拉曼光谱图像DL合并敏感度0.99/特异度0.98(AUC 0.99)，口腔照片DL敏感度0.97/特异度0.93，组织病理图像DL敏感度0.98/特异度0.97；提示DL可作为OSCC诊断的有效辅助工具。"},{"g":"B","title":"激光散斑成像与机器学习回归无损评估牙本质-复合树脂粘接完整性","src":"Annals of Biomedical Engineering","year":2026,"date":"08-30","pmid":"42669773","tags":["材料","牙体牙髓","AI/算法","器械/设备"],"note":"632nm He-Ne激光散斑+形态学特征+随机森林/支持向量回归预测剪切粘接强度：SVR校准R²=0.914/测试RMSE 0.234 MPa，RF校准R²=0.919/RMSE 0.228 MPa；为修复体界面早期完整性提供无损评估新路径(体外)。"},{"g":"B","title":"全自动AI数字工作流实现眶骨镜像：多中心研究","src":"Journal of Cranio-Maxillo-Facial Surgery","year":2026,"date":"09-01","pmid":"42418924","tags":["颌面外科","数字化","深度学习","器械/设备"],"note":"德/罗/美三国502例头颅CT训练nnU-Net自动眶骨分割+PCA/ICP对称面计算：分割DSC 0.936，对称面角偏差0.72°-0.95°，跨机构稳定；实现标准化高效的眶重建工作流。"},{"g":"B","title":"深度学习自动多平面分割TMJ结构：双中心研究","src":"Oral Surgery Oral Medicine Oral Pathology Oral Radiology","year":2026,"date":"09-01","pmid":"42431740","tags":["深度学习","影像","颌面外科","数字化"],"note":"双中心121例(242个TMJ)MRI，比较2D/3D U-Net、nnU-Net、Swin-Unet跨平面分割关节盘/髁突/关节结节：nnU-Net最优(ICC>0.99)，髁突Dice 0.949、关节盘Dice 0.865，跨平面误差<5%。"},{"g":"N","title":"Dentsply Sirona × Siemens Healthineers：全球首台牙科专用 MRI 获 FDA 批准","src":"行业速递 · 审批","year":2026,"date":"03-09","tags":["审批","器械/设备"],"note":"MAGNETOM Free.Max Dental Edition 获 FDA 510(k)，为行业首台专为牙科设计的 MRI（专用牙科线圈 const state = {grades:new Set(), tags:new Set(), year:"all", query:"", page:1, sort:"default"};
const PER_PAGE = 20;
let tagExpanded = false;

function esc(s){return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}
function uniqueTags(){const s=new Set();PAPERS.forEach(p=>p.tags.forEach(t=>s.add(t)));return [...s];}

function renderTagChips(){
  const row=document.getElementById("tagRow");row.innerHTML="";
  const chips = uniqueTags().map(t=>{
    const c=document.createElement("span");
    c.className="chip tag-chip"+(state.tags.has(t)?" on":"");
    c.textContent=t;
    c.onclick=()=>{state.tags.has(t)?state.tags.delete(t):state.tags.add(t);state.page=1;renderTagChips();renderList();};
    row.appendChild(c);
    return c;
  });
  // 关键词太多，默认折叠到两行，其余用"展开"收起
  const tops = [...new Set(chips.map(c=>c.offsetTop))].sort((a,b)=>a-b);
  const collapsible = tops.length > 2;
  const secondTop = collapsible ? tops[1] : null;
  chips.forEach(c=>{ if(collapsible && c.offsetTop > secondTop) c.dataset.hidden="1"; });
  if(collapsible){
    const btn = document.createElement("span");
    btn.className = "chip tag-chip expand-btn";
    const apply = ()=>{
      chips.forEach(c=>{ if(c.dataset.hidden==="1") c.style.display = tagExpanded ? "" : "none"; });
      btn.textContent = tagExpanded ? "收起 ▴" : "展开 ▾";
    };
    btn.onclick = ()=>{ tagExpanded = !tagExpanded; apply(); };
    row.appendChild(btn);
    apply();
  }
}

function matches(p){
  if(state.grades.size && !state.grades.has(p.g)) return false;
  if(state.year!=="all" && String(p.year)!==state.year) return false;
  if(state.tags.size && ![...state.tags].every(t=>p.tags.includes(t))) return false;
  if(state.query){const q=state.query.toLowerCase();if(!(p.title.toLowerCase().includes(q)||p.src.toLowerCase().includes(q))) return false;}
  return true;
}

function sortItems(items){
  const arr = items.slice();
  if(state.sort === "time"){
    // 最新优先：按完整日期（年份+月日）降序
    return arr.sort((a,b)=>(b.year+"-"+b.date).localeCompare(a.year+"-"+a.date));
  }
  return arr.sort((a,b)=>{
    const aN=a.g==="N", bN=b.g==="N";
    if(aN && bN) return (b.year+"-"+b.date).localeCompare(a.year+"-"+a.date);
    if(aN !== bN) return aN ? -1 : 1;
    return b.year-a.year || "SABC".indexOf(a.g)-"SABC".indexOf(b.g);
  });
}

function paperHTML(p){
  let meta = esc(p.src) + " · " + p.year + "-" + esc(p.date);
  if(p.g!=="N"){
    const isPMC = String(p.src).indexOf("PMC")>=0;
    const link = isPMC ? "https://pmc.ncbi.nlm.nih.gov/articles/PMC"+p.pmid+"/" : "https://pubmed.ncbi.nlm.nih.gov/"+p.pmid+"/";
    meta += ' · <a href="'+link+'" target="_blank">'+esc(String(p.pmid))+'</a>';
  }
  const tags = p.tags.map(t=>'<span class="tag">'+esc(t)+'</span>').join("");
  let detail="", toggle="";
  if(p.purpose){
    detail = '<div class="detail" style="display:none">'
      + '<div class="f"><b>研究目的</b>：'+esc(p.purpose)+'</div>'
      + '<div class="f"><b>研究设计 + 样本</b>：'+esc(p.design)+'</div>'
      + '<div class="f"><b>核心结果</b>：'+esc(p.result)+'</div>'
      + '<div class="f limit"><b>局限</b>：'+esc(p.limit)+'</div></div>';
    toggle = '<span class="toggle">▸ 详情</span>';
  }
  return '<div class="paper">'
    + '<div class="head"><span class="g '+p.g+'">'+p.g+'</span><h3>'+esc(p.title)+'</h3></div>'
    + '<div class="meta">'+meta+'</div>'
    + '<div class="tags">'+tags+'</div>'
    + '<div class="note">'+esc(p.note)+'</div>'
    + detail + toggle
    + '</div>';
}

function renderList(){
  const filtered = sortItems(PAPERS.filter(matches));
  const totalPages = Math.max(1, Math.ceil(filtered.length/PER_PAGE));
  if(state.page > totalPages) state.page = totalPages;
  if(state.page < 1) state.page = 1;
  const start = (state.page-1)*PER_PAGE;
  const pageItems = filtered.slice(start, start+PER_PAGE);
  document.getElementById("count").textContent = filtered.length;
  const list = document.getElementById("list");
  list.innerHTML = pageItems.length ? pageItems.map(paperHTML).join("") : '<div class="empty">没有符合条件的文献，试试重置筛选 🌿</div>';
  document.getElementById("pageInfo").textContent = state.page + " / " + totalPages + " 页";
  document.getElementById("prevPage").disabled = state.page <= 1;
  document.getElementById("nextPage").disabled = state.page >= totalPages;
}

function bind(){
  document.querySelectorAll("[data-g]").forEach(ch=>{
    ch.onclick=()=>{
      const g=ch.dataset.g;
      state.grades.has(g) ? state.grades.delete(g) : state.grades.add(g);
      ch.classList.toggle("on", state.grades.has(g));
      state.page=1; renderList();
    };
  });
  document.getElementById("yearSel").onchange=e=>{state.year=e.target.value;state.page=1;renderList();};
  document.querySelectorAll(".sort-chip").forEach(ch=>{
    ch.onclick=()=>{
      state.sort = ch.dataset.sort;
      document.querySelectorAll(".sort-chip").forEach(c=>c.classList.toggle("on", c.dataset.sort===state.sort));
      state.page=1; renderList();
    };
  });
  document.getElementById("searchBox").oninput=e=>{state.query=e.target.value.trim();state.page=1;renderList();};
  document.getElementById("prevPage").onclick=()=>{state.page--;renderList();};
  document.getElementById("nextPage").onclick=()=>{state.page++;renderList();};
  document.getElementById("resetAll").onclick=()=>{
    state.grades.clear();state.tags.clear();state.year="all";state.query="";state.page=1;state.sort="default";tagExpanded=false;
    document.querySelectorAll("[data-g]").forEach(c=>c.classList.remove("on"));
    document.querySelectorAll(".sort-chip").forEach(c=>c.classList.toggle("on", c.dataset.sort==="default"));
    document.getElementById("yearSel").value="all";
    document.getElementById("searchBox").value="";
    renderTagChips();renderList();
  };
  document.getElementById("list").addEventListener("click",e=>{
    const t=e.target.closest(".toggle");
    if(!t) return;
    const paper=t.closest(".paper");
    const detail=paper.querySelector(".detail");
    if(!detail) return;
    const open=detail.style.display==="block";
    detail.style.display=open?"none":"block";
    t.textContent=open?"▸ 详情":"▾ 收起";
  });
}

renderTagChips();bind();renderList();
</script>
<script>
if('serviceWorker' in navigator){
  window.addEventListener('load',()=>navigator.serviceWorker.register('sw.js'));
}
</script>
</body>
